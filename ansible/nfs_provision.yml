---
# nfs_provision.yml — Create an NFS volume with a dedicated export policy.
#
# Equivalent to:  orchestrio run yaml-workflows/workflows/nfs_provision.yaml
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml nfs_provision.yml
#
# Override variables on the command line:
#   ansible-playbook -i inventory/hosts.yml nfs_provision.yml \
#       -e volume_name=vol_nfs_demo -e volume_size=200 -e aggregate_name=aggr1
#
- name: Provision NFS volume on ONTAP
  hosts: ontap
  gather_facts: false
  connection: local

  vars:
    export_policy_name: "{{ volume_name }}_export_policy"

  tasks:
    # -- Step 1: Create the FlexVol volume ------------------------------
    - name: Create volume '{{ volume_name }}'
      netapp.ontap.na_ontap_volume:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: "{{ ontap_https }}"
        validate_certs: "{{ ontap_validate_certs }}"
        use_rest: always
        state: present
        name: "{{ volume_name }}"
        vserver: "{{ svm_name }}"
        aggregate_name: "{{ aggregate_name }}"
        size: "{{ volume_size }}"
        size_unit: "{{ volume_size_unit }}"
        junction_path: "/{{ volume_name }}"
        wait_for_completion: true
      no_log: false

    # -- Step 2: Create a dedicated NFS export policy -------------------
    - name: Create export policy '{{ export_policy_name }}'
      netapp.ontap.na_ontap_export_policy:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: "{{ ontap_https }}"
        validate_certs: "{{ ontap_validate_certs }}"
        use_rest: always
        state: present
        name: "{{ export_policy_name }}"
        vserver: "{{ svm_name }}"
      no_log: false

    # -- Step 3: Add a client-match rule to the policy ------------------
    - name: Add client rule '{{ client_match }}' to export policy
      netapp.ontap.na_ontap_export_policy_rule:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: "{{ ontap_https }}"
        validate_certs: "{{ ontap_validate_certs }}"
        use_rest: always
        state: present
        policy_name: "{{ export_policy_name }}"
        vserver: "{{ svm_name }}"
        client_match: "{{ client_match }}"
        ro_rule: any
        rw_rule: any
        super_user_security: any
        protocol: nfs
      no_log: false

    # -- Step 4: Assign the export policy to the volume -----------------
    - name: Assign export policy to volume '{{ volume_name }}'
      netapp.ontap.na_ontap_volume:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: "{{ ontap_https }}"
        validate_certs: "{{ ontap_validate_certs }}"
        use_rest: always
        state: present
        name: "{{ volume_name }}"
        vserver: "{{ svm_name }}"
        export_policy: "{{ export_policy_name }}"
        wait_for_completion: true
      no_log: false

    # -- Summary --------------------------------------------------------
    - name: Print summary
      ansible.builtin.debug:
        msg: >-
          Done — volume '{{ volume_name }}' ({{ volume_size }}{{ volume_size_unit }})
          on SVM '{{ svm_name }}', mount path: /{{ volume_name }},
          export policy '{{ export_policy_name }}' with client rule '{{ client_match }}'
