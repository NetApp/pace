[defaults]
# collections_path=. tells Ansible to resolve netapp.console from this repo
# directory via the ansible_collections/netapp/console symlink — no Galaxy
# install required.
#
# If you installed the collection via Galaxy instead, comment out or remove
# the collections_path line below so Ansible uses its default search path
# (~/.ansible/collections or the path set in ANSIBLE_COLLECTIONS_PATHS).
#collections_path   = .
host_key_checking  = False
stdout_callback    = yaml
interpreter_python = auto_silent
