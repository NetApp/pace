---
# =============================================================================
# NCL Protection Policy — dedicated variable defaults
# =============================================================================
# Usage:
#   ansible-playbook playbooks/protection_policies.yml \
#       --extra-vars "@vars/ncl_protection_policy.yml" \
#       -e ncl_admin_password=YOUR_PASSWORD
#
# Override any variable on the command line with -e, e.g.:
#   -e ncl_protection_policy_action=create
#   -e ncl_protection_policy_name="my-protection-policy"
#
# For secrets in production, encrypt with Ansible Vault:
#   ansible-vault encrypt vars/ncl_protection_policy.yml
# =============================================================================

# ── NCL appliance ─────────────────────────────────────────────────────────────
ncl_console_url: "" # REQUIRED: set your appliance URL
ncl_validate_certs: false                  # set true in production

# ── Admin credentials ─────────────────────────────────────────────────────────
ncl_admin_email: ""
ncl_admin_password: "" # REQUIRED: set via Vault or -e

# ── Organisation ──────────────────────────────────────────────────────────────
# The org_id from the API URL:
#   /storage-management/v1/organizations/<org_id>/protectionpolicies
ncl_org_id: ""

# ── Action ────────────────────────────────────────────────────────────────────
# Supported values: query | create | delete
ncl_protection_policy_action: "query"

# ── Policy identity ───────────────────────────────────────────────────────────
# Name used for create (state=present) and name-based delete (state=absent).
ncl_protection_policy_name: "ansible-protection-policy-1"
ncl_protection_policy_description: "Managed by Ansible"

# ID used for direct delete (state=absent with policy_id).
# Leave empty to delete by ncl_protection_policy_name instead.
ncl_protection_policy_id: ""

# ── Snapshot schedules (required for create) ──────────────────────────────────
# List of snapshot schedule objects. Each entry requires:
#   schedule        — cadence: HOURLY | DAILY | WEEKLY | MONTHLY
#   retention_count — number of snapshots to keep (integer >= 1)
#
# The example below enables all four cadences with sensible retention defaults.
# Remove or adjust entries to match your RPO/RTO requirements.
ncl_protection_policy_snapshot_schedules:
  - schedule: "HOURLY"
    retention_count: 2
  - schedule: "DAILY"
    retention_count: 7
  - schedule: "WEEKLY"
    retention_count: 4
  - schedule: "MONTHLY"
    retention_count: 3
