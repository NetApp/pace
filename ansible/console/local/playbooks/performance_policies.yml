---
# NCL performance policy management — list, create, or delete adaptive QoS
# performance policies.
#
# Driven by ncl_policy_action (query | create | delete) set in
# vars/ncl_performance_policy.yml or overridden on the CLI with -e.
#
# Usage:
#   # List all performance policies:
#   ansible-playbook playbooks/performance_policies.yml \
#       --extra-vars "@vars/ncl_performance_policy.yml" \
#       -e ncl_admin_password=SECRET
#
#   # Create a performance policy:
#   ansible-playbook playbooks/performance_policies.yml \
#       --extra-vars "@vars/ncl_performance_policy.yml" \
#       -e ncl_admin_password=SECRET \
#       -e ncl_policy_action=create
#
#   # Delete a performance policy by name:
#   ansible-playbook playbooks/performance_policies.yml \
#       --extra-vars "@vars/ncl_performance_policy.yml" \
#       -e ncl_admin_password=SECRET \
#       -e ncl_policy_action=delete
#
#   # Delete a performance policy by ID (skips name lookup):
#   ansible-playbook playbooks/performance_policies.yml \
#       --extra-vars "@vars/ncl_performance_policy.yml" \
#       -e ncl_admin_password=SECRET \
#       -e ncl_policy_action=delete \
#       -e ncl_policy_id=<uuid>
#
# Environment variable overrides (CI / secrets managers):
#   NCL_CONSOLE_URL    → ncl_console_url
#   NCL_ACCESS_TOKEN   → ncl_access_token
#   NCL_ORG_ID         → ncl_org_id
#   NCL_VALIDATE_CERTS → ncl_validate_certs

- name: NCL performance policy management
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../vars/ncl_performance_policy.yml

  vars:
    ncl_console_url:    "{{ lookup('env', 'NCL_CONSOLE_URL')    | default(ncl_console_url, true) }}"
    ncl_access_token:   "{{ lookup('env', 'NCL_ACCESS_TOKEN')   | default('', true) }}"
    ncl_org_id:         "{{ lookup('env', 'NCL_ORG_ID')         | default('', true) }}"
    ncl_validate_certs: "{{ lookup('env', 'NCL_VALIDATE_CERTS') | default(ncl_validate_certs, true) | bool }}"

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ncl_console_url | length > 0
          - (ncl_admin_email | default('') | length > 0 and ncl_admin_password | default('') | length > 0)
            or ncl_access_token | length > 0
          - ncl_policy_action in ['query', 'create', 'delete']
        fail_msg: >-
          Set ncl_console_url, credentials, and ncl_policy_action
          (query|create|delete) in vars/ncl_performance_policy.yml or via -e.

    - name: Login to Console
      netapp.console.generate_oauth_token:
        console_url:    "{{ ncl_console_url }}"
        email:          "{{ ncl_admin_email }}"
        password:       "{{ ncl_admin_password }}"
        validate_certs: "{{ ncl_validate_certs }}"
      register: _login
      when: ncl_access_token | length == 0
      no_log: true

    - name: Store access token
      ansible.builtin.set_fact:
        _ncl_access_token: >-
          {{ _login.access_token if (_login is not skipped) else ncl_access_token }}

    - name: Discover organisations
      netapp.console.local_organization_setup:
        access_token:   "{{ _ncl_access_token }}"
        state:          query
        console_url:    "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
      register: _ncl_orgs
      when: ncl_org_id | length == 0

    - name: Resolve org ID
      ansible.builtin.set_fact:
        _ncl_org_id: >-
          {{ ncl_org_id if ncl_org_id | length > 0
             else (_ncl_orgs.organizations | first).id }}

  tasks:
    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: query — list all performance policies
    # ══════════════════════════════════════════════════════════════════════════
    - name: "QUERY | List all performance policies"
      netapp.console.performance_policies:
        access_token:   "{{ _ncl_access_token }}"
        console_url:    "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id:         "{{ _ncl_org_id }}"
        state:          query
      register: _pp_query
      when: ncl_policy_action == 'query'

    - name: "QUERY | Show performance policies"
      ansible.builtin.debug:
        msg: >-
          Performance policies in org '{{ _ncl_org_id }}'
          ({{ _pp_query.policies | default([]) | length }}):
          {{ _pp_query.policies | default([]) | map(attribute='name') | list }}
      when: ncl_policy_action == 'query'

    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: create — ensure performance policy exists (idempotent)
    # ══════════════════════════════════════════════════════════════════════════
    - name: "CREATE | Ensure performance policy exists: {{ ncl_policy_name }}"
      netapp.console.performance_policies:
        access_token:             "{{ _ncl_access_token }}"
        console_url:              "{{ ncl_console_url }}"
        validate_certs:           "{{ ncl_validate_certs }}"
        org_id:                   "{{ _ncl_org_id }}"
        state:                    present
        name:                     "{{ ncl_policy_name }}"
        description:              "{{ ncl_policy_description | default('Managed by Ansible') }}"
        expected_latency:         "{{ ncl_policy_expected_latency }}"
        expected_iops_per_tb:     "{{ ncl_policy_expected_iops_per_tb }}"
        peak_iops_per_tb:         "{{ ncl_policy_peak_iops_per_tb }}"
        absolute_min_iops_per_tb: "{{ ncl_policy_absolute_min_iops_per_tb }}"
      register: _pp_create
      when: ncl_policy_action == 'create'

    - name: "CREATE | Summary"
      ansible.builtin.debug:
        msg: >-
          ╔══════════════════════════════════════════════════════╗
          ║      Performance Policy Management — Create          ║
          ╠══════════════════════════════════════════════════════╣
          ║ Name                    : {{ ncl_policy_name }}
          ║ ID                      : {{ _pp_create.policy.id | default('n/a') }}
          ║ Expected Latency (ms)   : {{ ncl_policy_expected_latency }}
          ║ Expected IOPS/TB        : {{ ncl_policy_expected_iops_per_tb }}
          ║ Peak IOPS/TB            : {{ ncl_policy_peak_iops_per_tb }}
          ║ Absolute Min IOPS/TB    : {{ ncl_policy_absolute_min_iops_per_tb }}
          ║ Changed                 : {{ _pp_create.changed }}
          ║ Message                 : {{ _pp_create.msg }}
          ╚══════════════════════════════════════════════════════╝
      when: ncl_policy_action == 'create'

    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: delete — remove performance policy by name or ID
    # ══════════════════════════════════════════════════════════════════════════
    - name: "DELETE | Remove performance policy"
      netapp.console.performance_policies:
        access_token:   "{{ _ncl_access_token }}"
        console_url:    "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id:         "{{ _ncl_org_id }}"
        state:          absent
        name: >-
          {{ ncl_policy_name
             if ncl_policy_id | default('') | length == 0
             else omit }}
        policy_id: >-
          {{ ncl_policy_id
             if ncl_policy_id | default('') | length > 0
             else omit }}
      register: _pp_delete
      when: ncl_policy_action == 'delete'

    - name: "DELETE | Summary"
      ansible.builtin.debug:
        msg: >-
          ╔══════════════════════════════════════════════════════╗
          ║      Performance Policy Management — Delete          ║
          ╠══════════════════════════════════════════════════════╣
          ║ Target  : {{ ncl_policy_name
                         if ncl_policy_id | default('') | length == 0
                         else ncl_policy_id }}
          ║ Changed : {{ _pp_delete.changed }}
          ║ Message : {{ _pp_delete.msg }}
          ╚══════════════════════════════════════════════════════╝
      when: ncl_policy_action == 'delete'
