---
# NCL service account management — list, create, or delete service accounts.
#
# Supported actions (ncl_sa_action):
#   list   — list all service accounts in the org
#   create — create a service account (idempotent by name)
#   delete — delete a service account by id (ncl_sa_id required)
#
# API endpoints used:
#   POST   /v1/management/organizations/{orgId}/serviceAccounts
#   GET    /v1/management/organizations/{orgId}/users?filter=userType ne 'agent'&limit=301
#   DELETE /v1/management/organizations/{orgId}/{serviceAccountId}
#
# Usage — list all service accounts:
#   ansible-playbook playbooks/service_account.yml \
#       --extra-vars "@vars/ncl.yml" \
#       -e ncl_sa_action=list
#
# Usage — create a service account:
#   ansible-playbook playbooks/service_account.yml \
#       --extra-vars "@vars/ncl.yml" \
#       -e ncl_sa_action=create \
#       -e ncl_sa_name="ansible-ci-account"
#
# Usage — create with role and description:
#   ansible-playbook playbooks/service_account.yml \
#       --extra-vars "@vars/ncl.yml" \
#       -e ncl_sa_action=create \
#       -e ncl_sa_name="ci-admin" \
#       -e ncl_sa_role="Organization Admin" \
#       -e ncl_sa_description="CI/CD pipeline account"
#
# Usage — delete by id:
#   ansible-playbook playbooks/service_account.yml \
#       --extra-vars "@vars/ncl.yml" \
#       -e ncl_sa_action=delete \
#       -e ncl_sa_id="<service-account-uuid>"
#
# Environment variable overrides (CI / secrets managers):
#   NCL_CONSOLE_URL    → ncl_console_url
#   NCL_ACCESS_TOKEN   → ncl_access_token
#   NCL_ORG_ID         → ncl_org_id
#   NCL_VALIDATE_CERTS → ncl_validate_certs

- name: NCL service account management (list / create / delete)
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../vars/ncl.yml

  vars:
    ncl_console_url: "{{ lookup('env', 'NCL_CONSOLE_URL')    | default(ncl_console_url,    true) }}"
    ncl_access_token: "{{ lookup('env', 'NCL_ACCESS_TOKEN')   | default('',                 true) }}"
    ncl_org_id: "{{ lookup('env', 'NCL_ORG_ID')         | default('',                 true) }}"
    ncl_validate_certs: "{{ lookup('env', 'NCL_VALIDATE_CERTS') | default(ncl_validate_certs, true) | bool }}"

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ncl_console_url | length > 0
          - (ncl_admin_email | length > 0 and ncl_admin_password | length > 0) or ncl_access_token | length > 0
          - ncl_sa_action in ['list', 'create', 'delete']
        fail_msg: >-
          Set ncl_console_url, credentials and ncl_sa_action
          (list | create | delete) in vars/ncl.yml or via -e.

    # ── Authentication ────────────────────────────────────────────────────────
    - name: Login to Console
      netapp.console.generate_oauth_token:
        console_url: "{{ ncl_console_url }}"
        email: "{{ ncl_admin_email }}"
        password: "{{ ncl_admin_password }}"
        validate_certs: "{{ ncl_validate_certs }}"
      register: _login
      when: ncl_access_token | length == 0
      no_log: true

    - name: Store access token
      ansible.builtin.set_fact:
        _ncl_access_token: >-
          {{ _login.access_token if (_login is not skipped) else ncl_access_token }}

    # ── Org resolution ────────────────────────────────────────────────────────
    - name: Discover organisations
      netapp.console.local_organization_setup:
        access_token: "{{ _ncl_access_token }}"
        state: query
        console_url: "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
      register: _ncl_orgs
      when: ncl_org_id | length == 0

    - name: Resolve org ID
      ansible.builtin.set_fact:
        _ncl_org_id: >-
          {{ ncl_org_id if ncl_org_id | length > 0
             else (_ncl_orgs.organizations | first).id }}

    - name: Show resolved org
      ansible.builtin.debug:
        msg: "Using org id={{ _ncl_org_id }}"

  tasks:
    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: list
    # ══════════════════════════════════════════════════════════════════════════
    - name: "LIST | Fetch all service accounts"
      netapp.console.service_accounts:
        access_token: "{{ _ncl_access_token }}"
        console_url: "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id: "{{ _ncl_org_id }}"
        state: query
      register: _sa_list
      when: ncl_sa_action == 'list'

    - name: "LIST | Show service accounts"
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════╗
          ║         Service Accounts — List                      ║
          ╠══════════════════════════════════════════════════════╣
          ║ Count : {{ _sa_list.service_accounts | length }}
          {% for sa in _sa_list.service_accounts %}║  • {{ sa.name | default('?') }} (id={{ sa.id | default('?') }})
          {% endfor %}╚══════════════════════════════════════════════════════╝
      when: ncl_sa_action == 'list'

    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: create
    # ══════════════════════════════════════════════════════════════════════════
    - name: "CREATE | Validate name is set"
      ansible.builtin.assert:
        that:
          - ncl_sa_name | default('') | length > 0
        fail_msg: "ncl_sa_name must be set when ncl_sa_action=create."
      when: ncl_sa_action == 'create'

    - name: "CREATE | Create service account '{{ ncl_sa_name | default('') }}'"
      netapp.console.service_accounts:
        access_token: "{{ _ncl_access_token }}"
        console_url: "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id: "{{ _ncl_org_id }}"
        state: present
        name: "{{ ncl_sa_name }}"
        description: "{{ ncl_sa_description | default('') }}"
        role: "{{ ncl_sa_role | default(omit) }}"
      register: _sa_create
      when: ncl_sa_action == 'create'

    - name: "CREATE | Summary"
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════╗
          ║         Service Account — Create                     ║
          ╠══════════════════════════════════════════════════════╣
          ║ Name        : {{ _sa_create.service_account.name | default(ncl_sa_name) }}
          ║ ID          : {{ _sa_create.service_account.id | default('n/a') }}
          ║ Client ID   : {{ _sa_create.service_account.clientId | default('n/a') }}
          ║ Changed     : {{ _sa_create.changed }}
          ║ Client Secret: {{ _sa_create.client_secret | default('(already existed — not shown)') }}
          ║ ⚠  Store the client secret now — it cannot be retrieved later.
          ╚══════════════════════════════════════════════════════╝
      when: ncl_sa_action == 'create'

    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: delete
    # ══════════════════════════════════════════════════════════════════════════
    - name: "DELETE | Validate name or service account id is set"
      ansible.builtin.assert:
        that:
          - (ncl_sa_name | default('') | length > 0) or (ncl_sa_id | default('') | length > 0)
        fail_msg: "Set ncl_sa_name or ncl_sa_id when ncl_sa_action=delete."
      when: ncl_sa_action == 'delete'

    - name: "DELETE | Delete service account{{ ' name=' + ncl_sa_name if ncl_sa_name | default('') | length > 0 else ' id=' + ncl_sa_id | default('') }}"
      netapp.console.service_accounts:
        access_token: "{{ _ncl_access_token }}"
        console_url: "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id: "{{ _ncl_org_id }}"
        state: absent
        name: "{{ ncl_sa_name | default(omit) }}"
        service_account_id: "{{ ncl_sa_id | default(omit) }}"
      register: _sa_delete
      when: ncl_sa_action == 'delete'

    - name: "DELETE | Summary"
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════╗
          ║         Service Account — Delete                     ║
          ╠══════════════════════════════════════════════════════╣
          ║ Target  : {{ ncl_sa_name | default(ncl_sa_id | default('')) }}
          ║ Changed : {{ _sa_delete.changed }}
          ║ Message : {{ _sa_delete.msg }}
          ╚══════════════════════════════════════════════════════╝
      when: ncl_sa_action == 'delete'
