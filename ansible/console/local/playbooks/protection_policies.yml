---
# NCL protection policy management — list, create, or delete snapshot-based
# protection policies.
#
# Driven by ncl_protection_policy_action (query | create | delete) set in
# vars/ncl_protection_policy.yml or overridden on the CLI with -e.
#
# Usage:
#   # List all protection policies:
#   ansible-playbook playbooks/protection_policies.yml \
#       --extra-vars "@vars/ncl_protection_policy.yml" \
#       -e ncl_admin_password=SECRET
#
#   # Create a protection policy:
#   ansible-playbook playbooks/protection_policies.yml \
#       --extra-vars "@vars/ncl_protection_policy.yml" \
#       -e ncl_admin_password=SECRET \
#       -e ncl_protection_policy_action=create
#
#   # Delete a protection policy by name:
#   ansible-playbook playbooks/protection_policies.yml \
#       --extra-vars "@vars/ncl_protection_policy.yml" \
#       -e ncl_admin_password=SECRET \
#       -e ncl_protection_policy_action=delete
#
#   # Delete a protection policy by ID (skips name lookup):
#   ansible-playbook playbooks/protection_policies.yml \
#       --extra-vars "@vars/ncl_protection_policy.yml" \
#       -e ncl_admin_password=SECRET \
#       -e ncl_protection_policy_action=delete \
#       -e ncl_protection_policy_id=<uuid>
#
# Environment variable overrides (CI / secrets managers):
#   NCL_CONSOLE_URL    → ncl_console_url
#   NCL_ACCESS_TOKEN   → ncl_access_token
#   NCL_ORG_ID         → ncl_org_id
#   NCL_VALIDATE_CERTS → ncl_validate_certs

- name: NCL protection policy management
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../vars/ncl_protection_policy.yml

  vars:
    ncl_console_url:    "{{ lookup('env', 'NCL_CONSOLE_URL')    | default(ncl_console_url, true) }}"
    ncl_access_token:   "{{ lookup('env', 'NCL_ACCESS_TOKEN')   | default('', true) }}"
    ncl_org_id:         "{{ lookup('env', 'NCL_ORG_ID')         | default('', true) }}"
    ncl_validate_certs: "{{ lookup('env', 'NCL_VALIDATE_CERTS') | default(ncl_validate_certs, true) | bool }}"

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ncl_console_url | length > 0
          - (ncl_admin_email | default('') | length > 0 and ncl_admin_password | default('') | length > 0)
            or ncl_access_token | length > 0
          - ncl_protection_policy_action in ['query', 'create', 'delete']
        fail_msg: >-
          Set ncl_console_url, credentials, and ncl_protection_policy_action
          (query|create|delete) in vars/ncl_protection_policy.yml or via -e.

    - name: Login to Console
      netapp.console.generate_oauth_token:
        console_url:    "{{ ncl_console_url }}"
        email:          "{{ ncl_admin_email }}"
        password:       "{{ ncl_admin_password }}"
        validate_certs: "{{ ncl_validate_certs }}"
      register: _login
      when: ncl_access_token | length == 0
      no_log: true

    - name: Store access token
      ansible.builtin.set_fact:
        _ncl_access_token: >-
          {{ _login.access_token if (_login is not skipped) else ncl_access_token }}

    - name: Discover organisations
      netapp.console.local_organization_setup:
        access_token:   "{{ _ncl_access_token }}"
        state:          query
        console_url:    "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
      register: _ncl_orgs
      when: ncl_org_id | length == 0

    - name: Resolve org ID
      ansible.builtin.set_fact:
        _ncl_org_id: >-
          {{ ncl_org_id if ncl_org_id | length > 0
             else (_ncl_orgs.organizations | first).id }}

  tasks:
    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: query — list all protection policies
    # ══════════════════════════════════════════════════════════════════════════
    - name: "QUERY | List all protection policies"
      netapp.console.protection_policies:
        access_token:   "{{ _ncl_access_token }}"
        console_url:    "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id:         "{{ _ncl_org_id }}"
        state:          query
      register: _prot_query
      when: ncl_protection_policy_action == 'query'

    - name: "QUERY | Show protection policies"
      ansible.builtin.debug:
        msg: >-
          Protection policies in org '{{ _ncl_org_id }}'
          ({{ _prot_query.policies | default([]) | length }}):
          {{ _prot_query.policies | default([]) | map(attribute='name') | list }}
      when: ncl_protection_policy_action == 'query'

    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: create — ensure protection policy exists (idempotent)
    # ══════════════════════════════════════════════════════════════════════════
    - name: "CREATE | Ensure protection policy exists: {{ ncl_protection_policy_name }}"
      netapp.console.protection_policies:
        access_token:       "{{ _ncl_access_token }}"
        console_url:        "{{ ncl_console_url }}"
        validate_certs:     "{{ ncl_validate_certs }}"
        org_id:             "{{ _ncl_org_id }}"
        state:              present
        name:               "{{ ncl_protection_policy_name }}"
        description:        "{{ ncl_protection_policy_description | default('Managed by Ansible') }}"
        snapshot_schedules: "{{ ncl_protection_policy_snapshot_schedules }}"
      register: _prot_create
      when: ncl_protection_policy_action == 'create'

    - name: "CREATE | Summary"
      ansible.builtin.debug:
        msg: >-
          ╔══════════════════════════════════════════════════════╗
          ║      Protection Policy Management — Create           ║
          ╠══════════════════════════════════════════════════════╣
          ║ Name      : {{ ncl_protection_policy_name }}
          ║ ID        : {{ _prot_create.policy.id | default('n/a') }}
          ║ Schedules : {{ ncl_protection_policy_snapshot_schedules
                           | map(attribute='schedule') | list | join(', ') }}
          ║ Changed   : {{ _prot_create.changed }}
          ║ Message   : {{ _prot_create.msg }}
          ╚══════════════════════════════════════════════════════╝
      when: ncl_protection_policy_action == 'create'

    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: delete — remove protection policy by name or ID
    # ══════════════════════════════════════════════════════════════════════════
    - name: "DELETE | Remove protection policy"
      netapp.console.protection_policies:
        access_token:   "{{ _ncl_access_token }}"
        console_url:    "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id:         "{{ _ncl_org_id }}"
        state:          absent
        name: >-
          {{ ncl_protection_policy_name
             if ncl_protection_policy_id | default('') | length == 0
             else omit }}
        policy_id: >-
          {{ ncl_protection_policy_id
             if ncl_protection_policy_id | default('') | length > 0
             else omit }}
      register: _prot_delete
      when: ncl_protection_policy_action == 'delete'

    - name: "DELETE | Summary"
      ansible.builtin.debug:
        msg: >-
          ╔══════════════════════════════════════════════════════╗
          ║      Protection Policy Management — Delete           ║
          ╠══════════════════════════════════════════════════════╣
          ║ Target  : {{ ncl_protection_policy_name
                         if ncl_protection_policy_id | default('') | length == 0
                         else ncl_protection_policy_id }}
          ║ Changed : {{ _prot_delete.changed }}
          ║ Message : {{ _prot_delete.msg }}
          ╚══════════════════════════════════════════════════════╝
      when: ncl_protection_policy_action == 'delete'
