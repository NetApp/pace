---
# NCL Active Directory (LDAP federation) management
#
# Supported actions (ncl_ad_action):
#   list    — list all LDAP federations in the org
#   create  — create a new federation (runs test-connection + test-authentication first)
#   enable  — enable an existing federation (PATCH stateDesired=ENABLED)
#   disable — disable an existing federation (PATCH stateDesired=DISABLED)
#   delete  — disable then delete a federation; requires ncl_ad_force=true when
#             the org has active fleets (storage systems are registered)
#
# API endpoints used:
#   POST   {console_url}/api/v1/components/test-connection
#   POST   {console_url}/api/v1/components/test-authentication
#   POST   {console_url}/v1/services/federation/organizations/{orgId}/federations
#   GET    {console_url}/v1/services/federation/organizations/{orgId}/federations
#   PATCH  {console_url}/v1/services/federation/organizations/{orgId}/federations/{id}
#   DELETE {console_url}/v1/services/federation/organizations/{orgId}/federations/{id}
#
# Usage — list all federations:
#   ansible-playbook playbooks/active_directory.yml \
#       --extra-vars "@vars/ncl_active_directory.yml" \
#       -e ncl_ad_action=list
#
# Usage — create a federation:
#   ansible-playbook playbooks/active_directory.yml \
#       --extra-vars "@vars/ncl_active_directory.yml" \
#       -e ncl_ad_action=create
#
# Usage — enable an existing federation:
#   ansible-playbook playbooks/active_directory.yml \
#       --extra-vars "@vars/ncl_active_directory.yml" \
#       -e ncl_ad_action=enable
#
# Usage — disable an existing federation:
#   ansible-playbook playbooks/active_directory.yml \
#       --extra-vars "@vars/ncl_active_directory.yml" \
#       -e ncl_ad_action=disable
#
# Usage — delete a federation (force required when fleets exist):
#   ansible-playbook playbooks/active_directory.yml \
#       --extra-vars "@vars/ncl_active_directory.yml" \
#       -e ncl_ad_action=delete \
#       -e ncl_ad_force=true
#
# Environment variable overrides (CI / secrets managers):
#   NCL_CONSOLE_URL    → ncl_console_url
#   NCL_ACCESS_TOKEN   → ncl_access_token
#   NCL_ORG_ID         → ncl_org_id
#   NCL_VALIDATE_CERTS → ncl_validate_certs

- name: NCL Active Directory — LDAP federation management
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../vars/ncl_active_directory.yml

  vars:
    ncl_console_url: "{{ lookup('env', 'NCL_CONSOLE_URL')    | default(ncl_console_url,    true) }}"
    ncl_access_token: "{{ lookup('env', 'NCL_ACCESS_TOKEN')   | default('',                 true) }}"
    ncl_org_id: "{{ lookup('env', 'NCL_ORG_ID')         | default('',                 true) }}"
    ncl_validate_certs: "{{ lookup('env', 'NCL_VALIDATE_CERTS') | default(ncl_validate_certs, true) | bool }}"

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ncl_console_url | length > 0
          - (ncl_admin_email | default('') | length > 0 and ncl_admin_password | default('') | length > 0)
            or ncl_access_token | length > 0
          - ncl_ad_action in ['list', 'create', 'enable', 'disable', 'delete']
        fail_msg: >-
          Set ncl_console_url, credentials and ncl_ad_action
          (list | create | enable | disable | delete) in vars/ncl_active_directory.yml or via -e.

    # ── Authentication ────────────────────────────────────────────────────────
    - name: Login to Console
      netapp.console.generate_oauth_token:
        console_url: "{{ ncl_console_url }}"
        email: "{{ ncl_admin_email }}"
        password: "{{ ncl_admin_password }}"
        validate_certs: "{{ ncl_validate_certs }}"
      register: _login
      when: ncl_access_token | length == 0
      no_log: true

    - name: Store access token
      ansible.builtin.set_fact:
        _ncl_access_token: >-
          {{ _login.access_token if (_login is not skipped) else ncl_access_token }}

    # ── Org resolution ────────────────────────────────────────────────────────
    - name: Discover organisations
      netapp.console.local_organization_setup:
        access_token: "{{ _ncl_access_token }}"
        state: query
        console_url: "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
      register: _ncl_orgs
      when: ncl_org_id | length == 0

    - name: Resolve org ID
      ansible.builtin.set_fact:
        _ncl_org_id: >-
          {{ ncl_org_id if ncl_org_id | length > 0
             else (_ncl_orgs.organizations | first).id }}

    - name: Show resolved org
      ansible.builtin.debug:
        msg: "Using org id={{ _ncl_org_id }}"

  tasks:
    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: list
    # ══════════════════════════════════════════════════════════════════════════
    - name: "LIST | Fetch all AD federations"
      netapp.console.active_directory:
        access_token: "{{ _ncl_access_token }}"
        console_url: "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id: "{{ _ncl_org_id }}"
        state: query
      register: _fed_list
      when: ncl_ad_action == 'list'

    - name: "LIST | Show federations"
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════╗
          ║         Active Directory Federations — List          ║
          ╠══════════════════════════════════════════════════════╣
          ║ Count : {{ _fed_list.federations | length }}
          {% for f in _fed_list.federations %}║  • {{ f.name | default('?') }} (id={{ f.id | default('?') }}, state={{ f.state | default('?') }})
          {% endfor %}╚══════════════════════════════════════════════════════╝
      when: ncl_ad_action == 'list'

    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: create
    # ══════════════════════════════════════════════════════════════════════════
    - name: "CREATE | Validate required vars"
      ansible.builtin.assert:
        that:
          - ncl_ad_name | default('') | length > 0
          - ncl_ad_connection_url | default('') | length > 0
          - ncl_ad_bind_dn | default('') | length > 0
          - ncl_ad_bind_credential | default('') | length > 0
          - ncl_ad_users_dn | default('') | length > 0
        fail_msg: >-
          ncl_ad_name, ncl_ad_connection_url, ncl_ad_bind_dn,
          ncl_ad_bind_credential and ncl_ad_users_dn are all required
          when ncl_ad_action=create.
      when: ncl_ad_action == 'create'

    - name: "CREATE | Create AD federation '{{ ncl_ad_name | default('') }}'"
      netapp.console.active_directory:
        access_token: "{{ _ncl_access_token }}"
        console_url: "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id: "{{ _ncl_org_id }}"
        state: present
        name: "{{ ncl_ad_name }}"
        connection_url: "{{ ncl_ad_connection_url }}"
        bind_dn: "{{ ncl_ad_bind_dn }}"
        bind_credential: "{{ ncl_ad_bind_credential }}"
        users_dn: "{{ ncl_ad_users_dn }}"
        connection_timeout: "{{ ncl_ad_connection_timeout | default(5000) }}"
        desired_state: "{{ ncl_ad_desired_state | default('ENABLED') }}"
        skip_connection_test: "{{ ncl_ad_skip_connection_test | default(false) }}"
        skip_auth_test: "{{ ncl_ad_skip_auth_test | default(false) }}"
        timeout: "{{ ncl_ad_timeout | default(300) }}"
      register: _fed_create
      when: ncl_ad_action == 'create'
      no_log: true

    - name: "CREATE | Summary"
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════╗
          ║         Active Directory — Create                    ║
          ╠══════════════════════════════════════════════════════╣
          ║ Name    : {{ _fed_create.federation.name | default(ncl_ad_name) }}
          ║ ID      : {{ _fed_create.federation.id | default('n/a') }}
          ║ State   : {{ _fed_create.federation.state | default('n/a') }}
          ║ Changed : {{ _fed_create.changed }}
          ╚══════════════════════════════════════════════════════╝
      when: ncl_ad_action == 'create'

    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: enable
    # ══════════════════════════════════════════════════════════════════════════
    - name: "ENABLE | Validate required vars"
      ansible.builtin.assert:
        that:
          - (ncl_ad_name | default('') | length > 0) or (ncl_ad_federation_id | default('') | length > 0)
          - ncl_ad_connection_url | default('') | length > 0
          - ncl_ad_bind_dn | default('') | length > 0
          - ncl_ad_bind_credential | default('') | length > 0
          - ncl_ad_users_dn | default('') | length > 0
        fail_msg: >-
          Set ncl_ad_name (or ncl_ad_federation_id) plus LDAP params
          when ncl_ad_action=enable.
      when: ncl_ad_action == 'enable'

    - name: "ENABLE | Enable AD federation '{{ ncl_ad_name | default(ncl_ad_federation_id | default('')) }}'"
      netapp.console.active_directory:
        access_token: "{{ _ncl_access_token }}"
        console_url: "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id: "{{ _ncl_org_id }}"
        state: present
        name: "{{ ncl_ad_name | default(omit) }}"
        connection_url: "{{ ncl_ad_connection_url }}"
        bind_dn: "{{ ncl_ad_bind_dn }}"
        bind_credential: "{{ ncl_ad_bind_credential }}"
        users_dn: "{{ ncl_ad_users_dn }}"
        desired_state: ENABLED
        timeout: "{{ ncl_ad_timeout | default(300) }}"
      register: _fed_enable
      when: ncl_ad_action == 'enable'
      no_log: true

    - name: "ENABLE | Summary"
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════╗
          ║         Active Directory — Enable                    ║
          ╠══════════════════════════════════════════════════════╣
          ║ Target  : {{ ncl_ad_name | default(ncl_ad_federation_id | default('')) }}
          ║ Changed : {{ _fed_enable.changed }}
          ║ Message : {{ _fed_enable.msg }}
          ╚══════════════════════════════════════════════════════╝
      when: ncl_ad_action == 'enable'

    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: disable
    # ══════════════════════════════════════════════════════════════════════════
    - name: "DISABLE | Validate required vars"
      ansible.builtin.assert:
        that:
          - (ncl_ad_name | default('') | length > 0) or (ncl_ad_federation_id | default('') | length > 0)
          - ncl_ad_connection_url | default('') | length > 0
          - ncl_ad_bind_dn | default('') | length > 0
          - ncl_ad_bind_credential | default('') | length > 0
          - ncl_ad_users_dn | default('') | length > 0
        fail_msg: >-
          Set ncl_ad_name (or ncl_ad_federation_id) plus LDAP params
          when ncl_ad_action=disable.
      when: ncl_ad_action == 'disable'

    - name: "DISABLE | Disable AD federation '{{ ncl_ad_name | default(ncl_ad_federation_id | default('')) }}'"
      netapp.console.active_directory:
        access_token: "{{ _ncl_access_token }}"
        console_url: "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id: "{{ _ncl_org_id }}"
        state: present
        name: "{{ ncl_ad_name | default(omit) }}"
        connection_url: "{{ ncl_ad_connection_url }}"
        bind_dn: "{{ ncl_ad_bind_dn }}"
        bind_credential: "{{ ncl_ad_bind_credential }}"
        users_dn: "{{ ncl_ad_users_dn }}"
        desired_state: DISABLED
        timeout: "{{ ncl_ad_timeout | default(300) }}"
      register: _fed_disable
      when: ncl_ad_action == 'disable'
      no_log: true

    - name: "DISABLE | Summary"
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════╗
          ║         Active Directory — Disable                   ║
          ╠══════════════════════════════════════════════════════╣
          ║ Target  : {{ ncl_ad_name | default(ncl_ad_federation_id | default('')) }}
          ║ Changed : {{ _fed_disable.changed }}
          ║ Message : {{ _fed_disable.msg }}
          ╚══════════════════════════════════════════════════════╝
      when: ncl_ad_action == 'disable'

    # ══════════════════════════════════════════════════════════════════════════
    # ACTION: delete
    # ══════════════════════════════════════════════════════════════════════════
    - name: "DELETE | Validate name or federation ID is set"
      ansible.builtin.assert:
        that:
          - (ncl_ad_name | default('') | length > 0) or (ncl_ad_federation_id | default('') | length > 0)
        fail_msg: "Set ncl_ad_name or ncl_ad_federation_id when ncl_ad_action=delete."
      when: ncl_ad_action == 'delete'

    # ── Fleet safety check ────────────────────────────────────────────────────
    # Query fleets to determine if any storage systems are registered.
    # If fleets exist, the AD identity provider may be in use; require force=true.
    - name: "DELETE | Query fleets to check for active storage systems"
      netapp.console.storage_fleets:
        access_token: "{{ _ncl_access_token }}"
        console_url: "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id: "{{ _ncl_org_id }}"
        state: query
      register: _fleet_list
      when: ncl_ad_action == 'delete'

    - name: "DELETE | Abort — org has active fleets; set ncl_ad_force=true to proceed"
      ansible.builtin.fail:
        msg: >-
          The organisation has {{ _fleet_list.fleets | length }} active fleet(s):
          {{ _fleet_list.fleets | map(attribute='name') | list | join(', ') }}.
          Deleting the AD federation may break authentication for registered storage systems.
          Set ncl_ad_force=true to override this safety check.
      when:
        - ncl_ad_action == 'delete'
        - (_fleet_list.fleets | default([]) | length) > 0
        - not (ncl_ad_force | default(false) | bool)

    - name: "DELETE | Delete AD federation '{{ ncl_ad_name | default(ncl_ad_federation_id | default('')) }}'"
      netapp.console.active_directory:
        access_token: "{{ _ncl_access_token }}"
        console_url: "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id: "{{ _ncl_org_id }}"
        state: absent
        name: "{{ ncl_ad_name | default(omit, true) }}"
        federation_id: "{{ ncl_ad_federation_id | default(omit, true) }}"
        timeout: "{{ ncl_ad_timeout | default(300) }}"
      register: _fed_delete
      when: ncl_ad_action == 'delete'

    - name: "DELETE | Summary"
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════╗
          ║         Active Directory — Delete                    ║
          ╠══════════════════════════════════════════════════════╣
          ║ Target  : {{ ncl_ad_name | default(ncl_ad_federation_id | default('')) }}
          ║ Changed : {{ _fed_delete.changed }}
          ║ Message : {{ _fed_delete.msg }}
          ╚══════════════════════════════════════════════════════╝
      when: ncl_ad_action == 'delete'
