---
# NCL volume management — list or delete ONTAP volumes via the Console proxy.
#
# Supports SINGLE-CLUSTER and MULTI-CLUSTER modes.
#
# MULTI-CLUSTER MODE  (set ncl_clusters list in vars/ncl_volume_delete.yml)
#   The playbook resolves every cluster's WE ID in a single pre-task pass
#   (one fleet fetch, one WE fetch per fleet) then loops over all of them.
#
#   ncl_clusters:
#     - cluster_name: "priyamscluster-1"
#     - cluster_name: "priyamscluster-2"
#     - we_id:        "OnPremWorkingEnvironment-abc123"   # skip lookup
#
# SINGLE-CLUSTER MODE  (ncl_clusters is empty — default)
#   Uses ncl_we_id / ncl_cluster_name / ncl_cluster_ip from the vars file.
#
# Usage examples:
#   # Query all clusters defined in vars:
#   ansible-playbook playbooks/volumes_delete.yml \
#       --extra-vars "@vars/ncl_volume_delete.yml" -e ncl_admin_password=SECRET
#
#   # Delete vol1 from every cluster in the list:
#   ansible-playbook playbooks/volumes_delete.yml \
#       --extra-vars "@vars/ncl_volume_delete.yml" \
#       -e ncl_admin_password=SECRET \
#       -e ncl_volume_action=delete \
#       -e ncl_volume_name=vol1
#
#   # Skip WE lookup (single cluster):
#   ansible-playbook playbooks/volumes_delete.yml \
#       --extra-vars "@vars/ncl_volume_delete.yml" \
#       -e ncl_admin_password=SECRET \
#       -e ncl_we_id=OnPremWorkingEnvironment-<uuid>
#
# Environment variable overrides:
#   NCL_CONSOLE_URL    -> ncl_console_url
#   NCL_ACCESS_TOKEN   -> ncl_access_token
#   NCL_ORG_ID         -> ncl_org_id
#   NCL_VALIDATE_CERTS -> ncl_validate_certs

- name: NCL volume management
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../vars/ncl_volume_delete.yml

  vars:
    ncl_console_url:    "{{ lookup('env', 'NCL_CONSOLE_URL')    | default(ncl_console_url, true) }}"
    ncl_access_token:   "{{ lookup('env', 'NCL_ACCESS_TOKEN')   | default('', true) }}"
    ncl_org_id:         "{{ lookup('env', 'NCL_ORG_ID')         | default('', true) }}"
    ncl_validate_certs: "{{ lookup('env', 'NCL_VALIDATE_CERTS') | default(ncl_validate_certs, true) | bool }}"

  pre_tasks:
    # ── Input validation ──────────────────────────────────────────────────────
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ncl_console_url | length > 0
          - (ncl_admin_email | default('') | length > 0 and ncl_admin_password | default('') | length > 0)
            or ncl_access_token | length > 0
          - ncl_volume_action in ['query', 'delete']
          - (ncl_clusters | default([]) | length > 0)
            or (ncl_we_id | default('') | length > 0)
            or (ncl_cluster_name | default('') | length > 0)
            or (ncl_cluster_ip | default('') | length > 0)
        fail_msg: >-
          Set ncl_console_url, credentials, ncl_volume_action (query|delete),
          and either ncl_clusters (multi-cluster) or at least one of
          ncl_we_id / ncl_cluster_name / ncl_cluster_ip (single-cluster).

    # ── Authentication ────────────────────────────────────────────────────────
    - name: Login to Console
      netapp.console.generate_oauth_token:
        console_url:    "{{ ncl_console_url }}"
        email:          "{{ ncl_admin_email }}"
        password:       "{{ ncl_admin_password }}"
        validate_certs: "{{ ncl_validate_certs }}"
      register: _login
      when: ncl_access_token | length == 0
      no_log: true

    - name: Store access token
      ansible.builtin.set_fact:
        _ncl_access_token: >-
          {{ _login.access_token if (_login is not skipped) else ncl_access_token }}

    - name: Discover organisations
      netapp.console.local_organization_setup:
        access_token:   "{{ _ncl_access_token }}"
        state:          query
        console_url:    "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
      register: _ncl_orgs
      when: ncl_org_id | length == 0

    - name: Resolve org ID
      ansible.builtin.set_fact:
        _ncl_org_id: >-
          {{ ncl_org_id if ncl_org_id | length > 0
             else (_ncl_orgs.organizations | first).id }}

    # ── Build effective cluster list ──────────────────────────────────────────
    # Two separate when-conditional tasks ensure Ansible stores the value as a
    # native list (not a string), regardless of whether ncl_clusters is set.
    - name: "WE RESOLVE | Use ncl_clusters list (multi-cluster mode)"
      ansible.builtin.set_fact:
        _effective_clusters: "{{ ncl_clusters }}"
      when: ncl_clusters | default([]) | length > 0

    - name: "WE RESOLVE | Build single-cluster entry (single-cluster mode)"
      ansible.builtin.set_fact:
        _effective_clusters:
          - we_id:        "{{ ncl_we_id | default('') }}"
            cluster_name: "{{ ncl_cluster_name | default('') }}"
            cluster_ip:   "{{ ncl_cluster_ip | default('') }}"
            volume_name:  "{{ ncl_volume_name | default('') }}"
            volume_names: "{{ ncl_volume_names | default([]) }}"
      when: ncl_clusters | default([]) | length == 0

    # ── WE lookup: fetch agentId and all fleet WEs once ──────────────────────
    # Only needed if at least one cluster entry doesn't already have a we_id.
    - name: "WE RESOLVE | Check if any cluster needs WE lookup"
      ansible.builtin.set_fact:
        _needs_lookup: "{{ _effective_clusters | rejectattr('we_id', 'defined') | list | length > 0
                          or _effective_clusters | selectattr('we_id', 'defined')
                                                 | selectattr('we_id', 'equalto', '') | list | length > 0 }}"

    - name: "WE RESOLVE | Fetch agentId from /system/about"
      netapp.console.local_agent_info:
        access_token:   "{{ _ncl_access_token }}"
        console_url:    "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
      register: _about
      when: _needs_lookup | bool

    - name: "WE RESOLVE | Store agentId"
      ansible.builtin.set_fact:
        _agent_id: "{{ _about.agent_id | default('') }}"
      when: _needs_lookup | bool

    - name: "WE RESOLVE | Fetch all fleets"
      netapp.console.storage_fleets:
        access_token:   "{{ _ncl_access_token }}"
        console_url:    "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        state:          query
        org_id:         "{{ _ncl_org_id }}"
      register: _all_fleets
      when: _needs_lookup | bool

    - name: "WE RESOLVE | Fetch clusters from every fleet"
      netapp.console.query_working_environments:
        access_token:   "{{ _ncl_access_token }}"
        console_url:    "{{ ncl_console_url }}"
        validate_certs: "{{ ncl_validate_certs }}"
        org_id:         "{{ _ncl_org_id }}"
        agent_id:       "{{ _agent_id }}"
      register: _fleet_wes
      when: _needs_lookup | bool

    # ── Resolve WE IDs for every cluster in the effective list ────────────────
    - name: "WE RESOLVE | Resolve all cluster WE IDs"
      ansible.builtin.set_fact:
        _resolved_clusters: >-
          {%- set result = [] -%}
          {%- set all_clusters = _fleet_wes.working_environments | default([]) -%}
          {%- for cluster in _effective_clusters -%}
            {%- set ns = namespace(we_id=cluster.we_id | default('')) -%}
            {%- if ns.we_id | length == 0 -%}
              {%- if cluster.cluster_name | default('') | length > 0 -%}
                {%- set match = all_clusters | selectattr('name', 'defined')
                                            | selectattr('name', 'equalto', cluster.cluster_name)
                                            | list | first | default({}) -%}
                {%- set ns.we_id = match.workingEnvironmentId | default('') -%}
              {%- elif cluster.cluster_ip | default('') | length > 0 -%}
                {%- for c in all_clusters -%}
                  {%- if cluster.cluster_ip in (c.managementInterfaces | default([])) -%}
                    {%- set ns.we_id = c.workingEnvironmentId | default('') -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endif -%}
            {%- set label = cluster.cluster_name | default(cluster.cluster_ip | default(ns.we_id)) -%}
            {%- set _ = result.append({
              'we_id':        ns.we_id,
              'label':        label,
              'resolved':     ns.we_id | length > 0,
              'volume_name':  cluster.volume_name  | default(ncl_volume_name  | default('')),
              'volume_names': cluster.volume_names | default(ncl_volume_names | default([])),
              'delete_all':   cluster.delete_all   | default(ncl_volume_delete_all | default(false))
            }) -%}
          {%- endfor -%}
          {{ result }}

    - name: "WE RESOLVE | Report unresolved clusters"
      ansible.builtin.debug:
        msg: "WARNING - could not resolve WE ID for cluster '{{ item.label }}'. It will be skipped."
      loop: "{{ _resolved_clusters | rejectattr('resolved') | list }}"
      loop_control:
        label: "{{ item.label }}"
      when: _resolved_clusters | rejectattr('resolved') | list | length > 0

    - name: "WE RESOLVE | Fail if no clusters could be resolved"
      ansible.builtin.fail:
        msg: >-
          None of the specified clusters could be resolved to a working environment.
          Check cluster names/IPs and fleet settings.
      when: _resolved_clusters | selectattr('resolved') | list | length == 0

    - name: "WE RESOLVE | Show resolved clusters"
      ansible.builtin.debug:
        msg: "OK {{ item.label }} -> {{ item.we_id }}"
      loop: "{{ _resolved_clusters | selectattr('resolved') | list }}"
      loop_control:
        label: "{{ item.label }}"

  tasks:
    # ── ACTION: query — list volumes for each resolved cluster ────────────────
    - name: "QUERY | List volumes for each cluster"
      netapp.console.ontap_volumes_management:
        access_token:           "{{ _ncl_access_token }}"
        console_url:            "{{ ncl_console_url }}"
        validate_certs:         "{{ ncl_validate_certs }}"
        org_id:                 "{{ _ncl_org_id }}"
        working_environment_id: "{{ item.we_id }}"
        state:                  query
      loop: "{{ _resolved_clusters | selectattr('resolved') | list }}"
      loop_control:
        label: "{{ item.label }}"
      register: _vol_query_results
      when: ncl_volume_action == 'query'

    - name: "QUERY | Show volumes per cluster"
      ansible.builtin.debug:
        msg: >-
          Cluster : {{ item.item.label }}
          WE ID   : {{ item.item.we_id }}
          Total   : {{ item.volumes | length }}
          Volumes : {{ item.volumes | map(attribute='name') | list | join(', ') }}
      loop: "{{ _vol_query_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.label | default('') }}"
      when:
        - ncl_volume_action == 'query'
        - not item.skipped | default(false)

    # ── ACTION: delete — remove volumes from each resolved cluster ────────────
    - name: "DELETE | Remove volume(s) from each cluster"
      netapp.console.ontap_volumes_management:
        access_token:           "{{ _ncl_access_token }}"
        console_url:            "{{ ncl_console_url }}"
        validate_certs:         "{{ ncl_validate_certs }}"
        org_id:                 "{{ _ncl_org_id }}"
        working_environment_id: "{{ item.we_id }}"
        state:                  absent
        delete_all:   "{{ item.delete_all if item.delete_all else omit }}"
        volume_name:  "{{ item.volume_name if item.volume_name | length > 0 and not item.delete_all else omit }}"
        volume_names: "{{ item.volume_names if item.volume_names | length > 0 and not item.delete_all else omit }}"
      loop: "{{ _resolved_clusters | selectattr('resolved') | list }}"
      loop_control:
        label: "{{ item.label }}"
      register: _vol_delete_results
      when: ncl_volume_action == 'delete'

    - name: "DELETE | Summary per cluster"
      ansible.builtin.debug:
        msg: >-
          Cluster   : {{ item.item.label }}
          WE ID     : {{ item.item.we_id }}
          Deleted   : {{ item.deleted | default([]) | join(', ') or 'none' }}
          Not found : {{ item.not_found | default([]) | join(', ') or 'none' }}
          Changed   : {{ item.changed }}
      loop: "{{ _vol_delete_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.label | default('') }}"
      when:
        - ncl_volume_action == 'delete'
        - not item.skipped | default(false)
