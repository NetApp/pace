---
# snapmirror_provision_dest_managed.yaml — Provision SnapMirror (destination-managed).
#
# All SnapMirror API calls are driven from the DESTINATION cluster.
# Source RW volume must already exist; dest DP volume is auto-created.
#
# Phases:
#   A   Source pre-flight     — verify source cluster + volume
#   B   Dest pre-flight       — verify dest cluster connectivity
#   B0  Cluster peer setup    — auto-create cluster peer if missing
#   B1  SVM peer setup        — auto-create SVM peer if missing
#   C   Dest volume setup     — auto-create DP volume if missing
#   D   Relationship setup    — create + initialize SnapMirror
#   E   Convergence polling   — poll until state=snapmirrored
#   F   Final validation      — health check + report
#
# Prerequisites:
#   1. ONTAP 9.8+ on both clusters
#   2. SnapMirror licence installed on both clusters
#   3. At least one intercluster LIF on each cluster
#   4. Source RW volume already exists on SOURCE_SVM
#   5. At least one online aggregate on the destination cluster
#   6. Admin credentials for both clusters
#
# Credentials are injected via environment variables:
#   SOURCE_HOST, SOURCE_USER, SOURCE_PASS
#   DEST_HOST,   DEST_USER,   DEST_PASS
#   SOURCE_SVM, SOURCE_VOLUME, DEST_SVM
#   SM_POLICY (optional, default: Asynchronous)
#
# Usage:
#   export SOURCE_HOST=10.x.x.x SOURCE_USER=admin SOURCE_PASS=secret
#   export SOURCE_SVM=vs1        SOURCE_VOLUME=vol_rw_01
#   export DEST_HOST=10.y.y.y    DEST_USER=admin   DEST_PASS=secret
#   export DEST_SVM=vs0
#   export SM_POLICY=Asynchronous
#   ansible-playbook ansible/snapmirror_provision_dest_managed.yml
#
- name: "SnapMirror — Destination-Managed Provisioning"
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    source_host: "{{ lookup('env', 'SOURCE_HOST') }}"
    source_user: "{{ lookup('env', 'SOURCE_USER') | default('admin', true) }}"
    source_pass: "{{ lookup('env', 'SOURCE_PASS') }}"
    dest_host: "{{ lookup('env', 'DEST_HOST') }}"
    dest_user: "{{ lookup('env', 'DEST_USER') | default('admin', true) }}"
    dest_pass: "{{ lookup('env', 'DEST_PASS') }}"
    source_svm: "{{ lookup('env', 'SOURCE_SVM') }}"
    source_volume: "{{ lookup('env', 'SOURCE_VOLUME') }}"
    dest_svm: "{{ lookup('env', 'DEST_SVM') }}"
    dest_volume: "{{ source_volume }}_dest"
    sm_policy: "{{ lookup('env', 'SM_POLICY') | default('Asynchronous', true) }}"
    validate_certs: false
    source_api: "https://{{ source_host }}/api"
    dest_api: "https://{{ dest_host }}/api"

  module_defaults:
    ansible.builtin.uri:
      force_basic_auth: true
      validate_certs: "{{ validate_certs }}"
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
        X-Dot-Client-App: "orchestrio"
      timeout: 30
      status_code: [200, 201, 202]

  tasks:
    # ================================================================
    # Phase A: Source pre-flight
    # ================================================================

    - name: "Phase A — Validate required environment variables"
      ansible.builtin.assert:
        that:
          - source_host | length > 0
          - source_pass | length > 0
          - dest_host | length > 0
          - dest_pass | length > 0
          - source_svm | length > 0
          - source_volume | length > 0
          - dest_svm | length > 0
        fail_msg: >-
          Missing env vars. Export SOURCE_HOST, SOURCE_PASS, DEST_HOST,
          DEST_PASS, SOURCE_SVM, SOURCE_VOLUME, DEST_SVM.
      no_log: false

    - name: "Phase A — Get source cluster info"
      ansible.builtin.uri:
        url: "{{ source_api }}/cluster?fields=name,version"
        url_username: "{{ source_user }}"
        url_password: "{{ source_pass }}"
        method: GET
      register: src_cluster
      no_log: false

    - name: "Phase A — Log source cluster"
      ansible.builtin.debug:
        msg: >-
          SOURCE CLUSTER | name={{ src_cluster.json.name }}
          | ontap={{ src_cluster.json.version.full }}

    - name: "Phase A — Get source volume info"
      ansible.builtin.uri:
        url: "{{ source_api }}/storage/volumes?name={{ source_volume }}&svm.name={{ source_svm }}&fields=name,uuid,state,type,space.size&max_records=1"
        url_username: "{{ source_user }}"
        url_password: "{{ source_pass }}"
        method: GET
      register: src_vol_resp
      no_log: false

    - name: "Phase A — Validate source volume exists"
      ansible.builtin.assert:
        that:
          - src_vol_resp.json.num_records | int > 0
        fail_msg: >-
          ABORTED — source volume '{{ source_volume }}' not found on {{ source_host }}.
      no_log: false

    - name: "Phase A — Store source volume record"
      ansible.builtin.set_fact:
        src_vol: "{{ src_vol_resp.json.records[0] }}"

    - name: "Phase A — Validate source volume is RW (not DP)"
      ansible.builtin.assert:
        that:
          - src_vol.type != 'dp'
        fail_msg: "ABORTED — source volume is type=dp; specify the RW volume."
      no_log: false

    - name: "Phase A — Log source volume"
      ansible.builtin.debug:
        msg: >-
          SOURCE VOLUME | svm={{ source_svm }}
          | name={{ src_vol.name }}
          | uuid={{ src_vol.uuid }}
          | state={{ src_vol.state }}
          | type={{ src_vol.type }}
          | size={{ src_vol.space.size | default('unknown') }}

    # ================================================================
    # Phase B: Dest pre-flight
    # ================================================================

    - name: "Phase B — Get destination cluster info"
      ansible.builtin.uri:
        url: "{{ dest_api }}/cluster?fields=name,version"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: dst_cluster
      no_log: false

    - name: "Phase B — Log destination cluster"
      ansible.builtin.debug:
        msg: >-
          DEST CLUSTER | name={{ dst_cluster.json.name }}
          | ontap={{ dst_cluster.json.version.full }}

    # ================================================================
    # Phase B0: Cluster peer setup (auto-create if missing)
    # ================================================================

    - name: "Phase B0 — Get intercluster LIFs on source"
      ansible.builtin.uri:
        url: "{{ source_api }}/network/ip/interfaces?services=intercluster_core&fields=name,ip.address&max_records=50"
        url_username: "{{ source_user }}"
        url_password: "{{ source_pass }}"
        method: GET
      register: src_ic_lifs_resp
      no_log: false

    - name: "Phase B0 — Get intercluster LIFs on destination"
      ansible.builtin.uri:
        url: "{{ dest_api }}/network/ip/interfaces?services=intercluster_core&fields=name,ip.address&max_records=50"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: dst_ic_lifs_resp
      no_log: false

    - name: "Phase B0 — Store IC LIF IP lists"
      ansible.builtin.set_fact:
        src_ic_ips: >-
          {{ src_ic_lifs_resp.json.records
             | default([])
             | map(attribute='ip')
             | map(attribute='address')
             | list }}
        dst_ic_ips: >-
          {{ dst_ic_lifs_resp.json.records
             | default([])
             | map(attribute='ip')
             | map(attribute='address')
             | list }}

    - name: "Phase B0 — Validate source has intercluster LIFs"
      ansible.builtin.assert:
        that:
          - src_ic_ips | length > 0
        fail_msg: >-
          ABORTED — Source cluster has no intercluster LIFs.
          SnapMirror requires at least one IC LIF on each cluster.
          Create one via System Manager: Network > IP Interfaces > Add > Role: Intercluster.
      no_log: false

    - name: "Phase B0 — Validate destination has intercluster LIFs"
      ansible.builtin.assert:
        that:
          - dst_ic_ips | length > 0
        fail_msg: >-
          ABORTED — Dest cluster has no intercluster LIFs.
          SnapMirror requires at least one IC LIF on each cluster.
          Create one via System Manager: Network > IP Interfaces > Add > Role: Intercluster.
      no_log: false

    - name: "Phase B0 — Log IC LIFs"
      ansible.builtin.debug:
        msg: "IC LIFs | src={{ src_ic_ips }} dst={{ dst_ic_ips }}"

    - name: "Phase B0 — Warn if IC LIF subnets differ"
      ansible.builtin.debug:
        msg: >-
          PRE-CONDITION WARNING | IC LIFs may be on different subnets.
          SnapMirror data transfers require TCP 11104 and 11105 to be open
          between subnets. If not routed, transfers will fail with error 13303812.
      when: >-
        (src_ic_ips[0] | default('0.0.0.0')).split('.')[:3] | join('.')
        != (dst_ic_ips[0] | default('0.0.0.0')).split('.')[:3] | join('.')

    - name: "Phase B0 — Get cluster peers on destination"
      ansible.builtin.uri:
        url: "{{ dest_api }}/cluster/peers?fields=name,uuid,status.state&max_records=10"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: dst_cluster_peers
      no_log: false

    - name: "Phase B0 — Get cluster peers on source"
      ansible.builtin.uri:
        url: "{{ source_api }}/cluster/peers?fields=name,uuid,status.state&max_records=10"
        url_username: "{{ source_user }}"
        url_password: "{{ source_pass }}"
        method: GET
      register: src_cluster_peers
      no_log: false

    - name: "Phase B0 — Store existing peer info"
      ansible.builtin.set_fact:
        dst_peers_ok: >-
          {{ dst_cluster_peers.json.records
             | default([])
             | selectattr('status.state', 'in', ['available', 'partial', 'pending'])
             | list }}
        src_peers_ok: >-
          {{ src_cluster_peers.json.records
             | default([])
             | selectattr('status.state', 'in', ['available', 'partial', 'pending'])
             | list }}

    - name: "Phase B0 — Log existing cluster peer (skip create)"
      ansible.builtin.debug:
        msg: >-
          CLUSTER PEER | already peered — dst sees src as
          '{{ dst_peers_ok[0].name }}' (state={{ dst_peers_ok[0].status.state }}) — skipping
      when: dst_peers_ok | length > 0

    - name: "Phase B0 — Auto-create cluster peer on source"
      ansible.builtin.uri:
        url: "{{ source_api }}/cluster/peers"
        url_username: "{{ source_user }}"
        url_password: "{{ source_pass }}"
        method: POST
        body_format: json
        body:
          peer_addresses: "{{ dst_ic_ips }}"
          generate_passphrase: true
          encryption:
            proposed: tls-psk
          initial_allowed_svms:
            - name: "{{ source_svm }}"
      register: src_peer_create
      when: dst_peers_ok | length == 0
      no_log: false

    - name: "Phase B0 — Accept cluster peer on destination"
      ansible.builtin.uri:
        url: "{{ dest_api }}/cluster/peers"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: POST
        body_format: json
        body:
          peer_addresses: "{{ src_ic_ips }}"
          passphrase: "{{ src_peer_create.json.passphrase }}"
          initial_allowed_svms:
            - name: "{{ dest_svm }}"
      when: dst_peers_ok | length == 0
      no_log: false

    - name: "Phase B0 — Wait for peer to settle"
      ansible.builtin.pause:
        seconds: 5
      when: dst_peers_ok | length == 0

    - name: "Phase B0 — Refresh cluster peers on destination"
      ansible.builtin.uri:
        url: "{{ dest_api }}/cluster/peers?fields=name,uuid,status.state&max_records=10"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: dst_cluster_peers_final
      no_log: false

    - name: "Phase B0 — Refresh cluster peers on source"
      ansible.builtin.uri:
        url: "{{ source_api }}/cluster/peers?fields=name,uuid,status.state&max_records=10"
        url_username: "{{ source_user }}"
        url_password: "{{ source_pass }}"
        method: GET
      register: src_cluster_peers_final
      no_log: false

    - name: "Phase B0 — Store final peer names"
      ansible.builtin.set_fact:
        dst_peers_final: >-
          {{ dst_cluster_peers_final.json.records
             | default([])
             | selectattr('status.state', 'in', ['available', 'partial', 'pending'])
             | list }}
        src_peers_final: >-
          {{ src_cluster_peers_final.json.records
             | default([])
             | selectattr('status.state', 'in', ['available', 'partial', 'pending'])
             | list }}

    - name: "Phase B0 — Set peer_name and src_peer_name"
      ansible.builtin.set_fact:
        peer_name: "{{ dst_peers_final[0].name | default('') }}"
        dst_peer_uuid: "{{ dst_peers_final[0].uuid | default('') }}"
        src_peer_name: "{{ src_peers_final[0].name | default('') }}"

    - name: "Phase B0 — Log cluster peer names"
      ansible.builtin.debug:
        msg: "CLUSTER PEER | dst sees src as '{{ peer_name }}'"

    # ================================================================
    # Phase B — Get aggregate
    # ================================================================

    - name: "Phase B — Auto-select first aggregate on destination"
      ansible.builtin.uri:
        url: "{{ dest_api }}/storage/aggregates?fields=name,state&max_records=1"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: aggr_resp
      no_log: false

    - name: "Phase B — Store aggregate name"
      ansible.builtin.set_fact:
        aggr_name: "{{ aggr_resp.json.records[0].name | default('') }}"

    - name: "Phase B — Validate an aggregate was found"
      ansible.builtin.assert:
        that:
          - aggr_name | length > 0
        fail_msg: "ABORTED — no aggregate found on destination cluster."
      no_log: false

    - name: "Phase B — Log destination aggregate"
      ansible.builtin.debug:
        msg: "DEST AGGREGATE | name={{ aggr_name }}"

    # ================================================================
    # Phase B1: SVM peer setup (auto-create if missing)
    # ================================================================

    - name: "Phase B1 — Get SVM peers on destination"
      ansible.builtin.uri:
        url: "{{ dest_api }}/svm/peers?svm.name={{ dest_svm }}&fields=uuid,name,state,peer&max_records=10"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: svm_peers_resp
      no_log: false

    - name: "Phase B1 — Check for existing SVM peer"
      ansible.builtin.set_fact:
        svm_peers_ok: >-
          {{ svm_peers_resp.json.records
             | default([])
             | selectattr('state', 'in', ['peered', 'initiated'])
             | list }}

    - name: "Phase B1 — Store source SVM alias (existing peer)"
      ansible.builtin.set_fact:
        source_svm_alias: >-
          {{ svm_peers_ok[0].peer.svm.name | default(source_svm) }}
      when: svm_peers_ok | length > 0

    - name: "Phase B1 — Log existing SVM peer (skip create)"
      ansible.builtin.debug:
        msg: >-
          SVM PEER | already peered '{{ dest_svm }}' <-> '{{ source_svm }}'
          (alias='{{ source_svm_alias }}', state={{ svm_peers_ok[0].state }}) — skipping
      when: svm_peers_ok | length > 0

    - name: "Phase B1 — Grant SVM peer-permission on source"
      ansible.builtin.uri:
        url: "{{ source_api }}/svm/peer-permissions"
        url_username: "{{ source_user }}"
        url_password: "{{ source_pass }}"
        method: POST
        body_format: json
        body:
          svm:
            name: "{{ source_svm }}"
          cluster_peer:
            name: "{{ src_peer_name }}"
          applications:
            - snapmirror
        status_code: [200, 201, 202, 409]
      register: svm_perm
      when: svm_peers_ok | length == 0
      no_log: false

    - name: "Phase B1 — Create SVM peer from destination"
      ansible.builtin.uri:
        url: "{{ dest_api }}/svm/peers"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: POST
        body_format: json
        body:
          svm:
            name: "{{ dest_svm }}"
          peer:
            svm:
              name: "{{ source_svm }}"
            cluster:
              name: "{{ peer_name }}"
          applications:
            - snapmirror
        status_code: [200, 201, 202, 409]
      register: svm_peer_create
      when: svm_peers_ok | length == 0
      no_log: false

    - name: "Phase B1 — Poll SVM peer creation job"
      ansible.builtin.uri:
        url: "{{ dest_api }}/cluster/jobs/{{ svm_peer_create.json.job.uuid }}"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: svm_peer_job
      until: svm_peer_job.json.state in ['success', 'failure']
      retries: 30
      delay: 10
      failed_when: svm_peer_job.json.state == 'failure'
      when: >-
        svm_peers_ok | length == 0
        and svm_peer_create is not skipped
        and svm_peer_create.json.job is defined
      no_log: false

    - name: "Phase B1 — Refresh SVM peers for alias lookup"
      ansible.builtin.uri:
        url: "{{ dest_api }}/svm/peers?svm.name={{ dest_svm }}&fields=uuid,name,state,peer&max_records=10"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: svm_peers_final
      when: svm_peers_ok | length == 0
      no_log: false

    - name: "Phase B1 — Store source SVM alias (new peer)"
      ansible.builtin.set_fact:
        source_svm_alias: >-
          {{ (svm_peers_final.json.records | default([]))[0].peer.svm.name
             | default(source_svm) }}
      when: svm_peers_ok | length == 0

    - name: "Phase B1 — Log SVM peer created"
      ansible.builtin.debug:
        msg: "SVM PEER | created '{{ dest_svm }}' <-> '{{ source_svm }}'"
      when: svm_peers_ok | length == 0

    # ================================================================
    # Phase C: Dest volume setup (auto-create DP if missing)
    # ================================================================

    - name: "Phase C — Check if destination DP volume already exists"
      ansible.builtin.uri:
        url: "{{ dest_api }}/storage/volumes?name={{ dest_volume }}&svm.name={{ dest_svm }}&fields=name,uuid,state,type&max_records=1"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: check_dest
      no_log: false

    - name: "Phase C — Create dest DP volume"
      ansible.builtin.uri:
        url: "{{ dest_api }}/storage/volumes?return_timeout=120"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: POST
        body_format: json
        body:
          name: "{{ dest_volume }}"
          type: dp
          svm:
            name: "{{ dest_svm }}"
          aggregates:
            - name: "{{ aggr_name }}"
          space:
            size: "{{ src_vol.space.size }}"
      register: create_vol
      when: check_dest.json.num_records | int == 0
      failed_when: false
      no_log: false

    - name: "Phase C — Log volume create result"
      ansible.builtin.debug:
        msg: >-
          {{ 'DEST VOLUME | created' if create_vol.status | default(0) in [200, 201, 202]
             else 'create_dest_volume — skipped (may already exist)' }}
      when: check_dest.json.num_records | int == 0

    - name: "Phase C — Log skip when volume already exists"
      ansible.builtin.debug:
        msg: "Dest volume '{{ dest_volume }}' already exists — skipping create."
      when: check_dest.json.num_records | int > 0

    - name: "Phase C — Verify destination volume"
      ansible.builtin.uri:
        url: "{{ dest_api }}/storage/volumes?name={{ dest_volume }}&svm.name={{ dest_svm }}&fields=name,uuid,state,type&max_records=1"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: dst_vol_resp
      failed_when: dst_vol_resp.json.num_records | int == 0
      no_log: false

    - name: "Phase C — Store destination volume record"
      ansible.builtin.set_fact:
        dst_vol: "{{ dst_vol_resp.json.records[0] }}"

    - name: "Phase C — Log destination volume"
      ansible.builtin.debug:
        msg: >-
          DEST VOLUME | svm={{ dest_svm }}
          | name={{ dst_vol.name }}
          | uuid={{ dst_vol.uuid }}
          | state={{ dst_vol.state }}
          | type={{ dst_vol.type }}

    # ================================================================
    # Phase D: Relationship setup (create + initialize)
    # ================================================================

    - name: "Phase D — Check if SnapMirror relationship already exists"
      ansible.builtin.uri:
        url: "{{ dest_api }}/snapmirror/relationships?destination.path={{ dest_svm }}:{{ dest_volume }}&fields=uuid,state,healthy&max_records=1"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: existing_rel
      no_log: false

    - name: "Phase D — Log relationship check"
      ansible.builtin.debug:
        msg: "RELATIONSHIP CHECK | existing={{ existing_rel.json.num_records }}"

    - name: "Phase D — Create SnapMirror relationship"
      ansible.builtin.uri:
        url: "{{ dest_api }}/snapmirror/relationships?return_timeout=120"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: POST
        body_format: json
        body:
          source:
            path: "{{ source_svm_alias }}:{{ source_volume }}"
            cluster:
              name: "{{ peer_name }}"
          destination:
            path: "{{ dest_svm }}:{{ dest_volume }}"
          policy:
            name: "{{ sm_policy }}"
      register: sm_create
      when: existing_rel.json.num_records | int == 0
      failed_when: false
      no_log: false

    - name: "Phase D — Poll relationship creation job"
      ansible.builtin.uri:
        url: "{{ dest_api }}/cluster/jobs/{{ sm_create.json.job.uuid }}"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: sm_job
      until: sm_job.json.state in ['success', 'failure']
      retries: 30
      delay: 10
      failed_when: sm_job.json.state == 'failure'
      when: >-
        sm_create is not skipped
        and sm_create.json is defined
        and sm_create.json.job is defined
      no_log: false

    # ================================================================
    # Phase E: Convergence polling
    # ================================================================

    - name: "Phase E — Look up SnapMirror relationship"
      ansible.builtin.uri:
        url: "{{ dest_api }}/snapmirror/relationships?destination.path={{ dest_svm }}:{{ dest_volume }}&fields=uuid,source.path,destination.path,state,lag_time,healthy,policy.name&max_records=1"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: rel_resp
      failed_when: rel_resp.json.num_records | int == 0
      no_log: false

    - name: "Phase E — Store relationship UUID"
      ansible.builtin.set_fact:
        rel_uuid: "{{ rel_resp.json.records[0].uuid }}"

    - name: "Phase E — Log relationship found"
      ansible.builtin.debug:
        msg: >-
          RELATIONSHIP | uuid={{ rel_uuid }}
          | state={{ rel_resp.json.records[0].state }}
          | healthy={{ rel_resp.json.records[0].healthy | default('unknown') }}
          | policy={{ rel_resp.json.records[0].policy.name | default('unknown') }}

    - name: "Phase E — Trigger baseline transfer"
      ansible.builtin.uri:
        url: "{{ dest_api }}/snapmirror/relationships/{{ rel_uuid }}/transfers?return_timeout=120"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: POST
        body_format: json
        body: {}
      register: sm_transfer
      failed_when: false
      no_log: false

    - name: "Phase E — Abort on IC LIF connectivity failure (error 13303812)"
      ansible.builtin.fail:
        msg: >-
          ABORTED — SnapMirror initialize failed: intercluster LIF connectivity issue.
          Error: {{ sm_transfer.json | default(sm_transfer.msg | default('unknown')) }}
          src IC: {{ src_ic_ips }}  dst IC: {{ dst_ic_ips }}
          Cause: TCP ports 11104/11105 are likely blocked between these IPs.
          Fix: Ask your lab admin to open TCP 11104 and 11105 between the subnets.
      when: >-
        sm_transfer.status | default(0) not in [200, 201, 202]
        and '13303812' in (sm_transfer.json | default({}) | string)

    - name: "Phase E — Log transfer result"
      ansible.builtin.debug:
        msg: >-
          Baseline transfer {{ 'triggered' if sm_transfer.status | default(0) in [200, 201, 202]
          else 'skipped (may already be initialized)' }}.

    - name: "Phase E — Poll until relationship is snapmirrored"
      ansible.builtin.uri:
        url: "{{ dest_api }}/snapmirror/relationships/{{ rel_uuid }}?fields=state,lag_time,healthy"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: sm_status
      until: sm_status.json.state == 'snapmirrored'
      retries: 120
      delay: 15
      no_log: false

    # ================================================================
    # Phase F: Final validation
    # ================================================================

    - name: "Phase F — Get final relationship state"
      ansible.builtin.uri:
        url: "{{ dest_api }}/snapmirror/relationships/{{ rel_uuid }}?fields=uuid,source.path,destination.path,state,lag_time,healthy,policy.name"
        url_username: "{{ dest_user }}"
        url_password: "{{ dest_pass }}"
        method: GET
      register: final
      no_log: false

    - name: "Phase F — Print provisioning summary"
      ansible.builtin.debug:
        msg: |
          === SNAPMIRROR PROVISION COMPLETE ===

            Source:      {{ source_svm }}:{{ source_volume }} @ {{ source_host }} ({{ src_cluster.json.version.full }})
            Destination: {{ dest_svm }}:{{ dest_volume }} @ {{ dest_host }} ({{ dst_cluster.json.version.full }})
            Aggregate:   {{ aggr_name }}
            Policy:      {{ final.json.policy.name | default(sm_policy) }}
            State:       {{ final.json.state }}
            Healthy:     {{ final.json.healthy }}
            Lag time:    {{ final.json.lag_time | default('N/A') }}
