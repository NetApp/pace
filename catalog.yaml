  - id: cluster-setup
    description: Create a storage cluster from two pre-cluster nodes
    products: [ONTAP]
    product: ontap
    ontap_min: "9.8"
    owners: [57388sp, kxvya-git]
    status: verified
    tags: [cluster, setup]
    verification:
      verified_by: 57388sp
      tested_at: "2026-05-29"
      ontap_version: "9.8"
      environment: other
      notes: "Python: 57388sp, Ansible: kxvya-git"
    variants:
      python:
        path: python/ontap/cluster_setup_basic.py
        command: "python cluster_setup_basic.py"
        cwd: python/ontap
        prerequisites:
          env:
            - ONTAP_HOST
            - ONTAP_USER
            - ONTAP_PASS
            - CLUSTER_NAME
            - CLUSTER_PASS
            - CLUSTER_MGMT_IP
            - CLUSTER_NETMASK
            - CLUSTER_GATEWAY
            - PARTNER_MGMT_IP
          setup: "pip install -r requirements.txt"
        inputs:
          - cluster_name
          - cluster_pass
          - cluster_mgmt_ip
          - cluster_netmask
          - cluster_gateway
          - partner_mgmt_ip
        outputs: [cluster_name, job_status]
      go:
        path: go/ontap/cluster_setup_basic/main.go
        command: "go run ."
        cwd: go/ontap/cluster_setup_basic
        prerequisites:
          env:
            - ONTAP_HOST
            - ONTAP_USER
            - ONTAP_PASS
            - CLUSTER_NAME
            - CLUSTER_PASS
            - CLUSTER_MGMT_IP
            - CLUSTER_NETMASK
            - CLUSTER_GATEWAY
            - PARTNER_MGMT_IP
          setup: "cd go && go mod download"
        inputs:
          - cluster_name
          - cluster_pass
          - cluster_mgmt_ip
          - cluster_netmask
          - cluster_gateway
          - partner_mgmt_ip
        outputs: [cluster_name, job_status]
      ansible:
        path: ansible/ontap/cluster_setup.yml
        command: "ansible-playbook -i inventory/hosts.yml cluster_setup.yml"
        cwd: ansible/ontap
        prerequisites:
          env: [ontap_hostname, ontap_username, ontap_password]
          setup: "ansible-galaxy collection install -r requirements.yml"
        inputs:
          - cluster_name
          - cluster_pass
          - cluster_mgmt_ip
          - cluster_netmask
          - cluster_gateway
          - partner_mgmt_ip
        outputs: [cluster_name, job_status]

