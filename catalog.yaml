# Machine-readable index of Pace automation examples.
# Field definitions: docs/catalog-spec.md
#
# Examples are organized by product: `product` is the folder slug and must match
# the variant paths, which live under <tool>/<product>/ (plus /<deployment>/ for
# products that have deployment variants).

use_cases:
  - id: cluster-info
    description: Retrieve cluster version and list nodes with serial numbers
    products: [ONTAP]
    product: ontap
    ontap_min: "9.8"
    owners: [57388sp, kxvya-git, mahatvagarg]
    status: verified
    tags: [cluster, read-only]
    verification:
      verified_by: 57388sp
      tested_at: "2026-05-29"
      ontap_version: "9.8"
      environment: other
      notes: "Python: 57388sp, Ansible: kxvya-git, Terraform: mahatvagarg"
    variants:
      python:
        path: python/ontap/cluster_info.py
        command: "python cluster_info.py"
        cwd: python/ontap
        prerequisites:
          env: [ONTAP_HOST, ONTAP_PASS, ONTAP_USER]
          setup: "pip install -r requirements.txt"
        inputs: []
        outputs: [cluster_version, nodes]
      ansible:
        path: ansible/ontap/cluster_info.yml
        command: "ansible-playbook -i inventory/hosts.yml cluster_info.yml"
        cwd: ansible/ontap
        prerequisites:
          env: [ontap_hostname, ontap_username, ontap_password]
          setup: "ansible-galaxy collection install -r requirements.yml"
        inputs: []
        outputs: [cluster_version, nodes]
      terraform:
        path: terraform/ontap/cluster-info
        command: "terraform init && terraform apply"
        cwd: terraform/ontap/cluster-info
        prerequisites:
          env: []
          setup: "cp terraform.tfvars.example terraform.tfvars && terraform init"
        inputs: [ontap_host, ontap_username, ontap_password, validate_certs]
        outputs: [cluster_name, cluster_version, nodes]

  - id: nfs-provision
    description: Create an NFS volume with a dedicated export policy and client rule
    products: [ONTAP]
    product: ontap
    ontap_min: "9.8"
    owners: [57388sp, kxvya-git, mahatvagarg]
    status: verified
    tags: [nfs, provisioning]
    verification:
      verified_by: 57388sp
      tested_at: "2026-05-29"
      ontap_version: "9.8"
      environment: other
      notes: "Python: 57388sp, Ansible: kxvya-git, Terraform: mahatvagarg"
    variants:
      python:
        path: python/ontap/nfs_provision.py
        command: >-
          python nfs_provision.py --svm vs0 --volume vol_nfs_test_01
          --size 100MB --aggregate aggr1 --client-match 10.0.0.0/8
        cwd: python/ontap
        prerequisites:
          env: [ONTAP_HOST, ONTAP_PASS, ONTAP_USER]
          setup: "pip install -r requirements.txt"
        inputs: [svm, volume, size, aggregate, client_match]
        outputs: [volume_name, mount_path, export_policy]
      ansible:
        path: ansible/ontap/nfs_provision.yml
        command: "ansible-playbook -i inventory/hosts.yml nfs_provision.yml"
        cwd: ansible/ontap
        prerequisites:
          env: [ontap_hostname, ontap_username, ontap_password]
          setup: "ansible-galaxy collection install -r requirements.yml"
        inputs: [svm_name, volume_name, volume_size, volume_size_unit, aggregate_name, client_match]
        outputs: [volume_name, mount_path, export_policy]
      terraform:
        path: terraform/ontap/nfs-provision
        command: "terraform init && terraform apply"
        cwd: terraform/ontap/nfs-provision
        prerequisites:
          env: []
          setup: "cp terraform.tfvars.example terraform.tfvars && terraform init"
        inputs:
          - ontap_host
          - ontap_username
          - ontap_password
          - validate_certs
          - svm_name
          - volume_name
          - volume_size
          - volume_size_unit
          - aggregate_name
          - client_match
        outputs: [volume_name, mount_path, export_policy, client_match]

