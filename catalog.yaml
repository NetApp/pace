  # ── NetApp Console Local examples ──────────────────────────────────────────

  - id: console-local-user-registration
    description: Bootstrap the first admin user on a NetApp Console Local appliance and optionally set up the default organisation
    products: [Console]
    product: console
    deployment: local
    ontap_min: "9.8"
    owners: [priyams]
    status: draft
    tags: [console, user-management, onboarding]
    variants:
      ansible:
        path: ansible/console/local/playbooks/user_registration.yml
        command: "ansible-playbook playbooks/user_registration.yml --extra-vars \"@vars/ncl.yml\""
        cwd: ansible/console/local
        prerequisites:
          env: [ncl_console_url, ncl_admin_password]
          setup: "ansible-galaxy collection install -r requirements.yml"
        inputs: [ncl_admin_email, ncl_admin_password, ncl_org_name]
        outputs: [user_registered, org_id]

  - id: console-local-site
