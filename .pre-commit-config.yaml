repos:
  # ── Python linting & formatting ──────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── Commit message lint ──────────────────────────────────────
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  # ── Secret scanning ─────────────────────────────────────────
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.94.2
    hooks:
      - id: trufflehog
        entry: trufflehog git file://. --since-commit HEAD --only-verified --fail
        stages: [pre-push]

  # ── YAML syntax ─────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ── License headers ─────────────────────────────────────────
  # Inserts and verifies the NetApp copyright header on every source file.
  # The plain-text template lives at .github/license-headers/header.txt;
  # each hook below wraps it in the appropriate comment syntax.
  # Exempt files (Markdown, requirements.txt, inventory data, *.example,
  # dependabot.yml) are excluded via the per-hook patterns.
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: insert-license (Python / YAML / Terraform / Shell)
        args:
          - --license-filepath=.github/license-headers/header.txt
          - --comment-style=#
        files: '\.(py|yml|yaml|tf|sh)$'
        exclude: |
          (?x)^(
            ansible/.*/inventory/.*|
            ansible/.*/group_vars/.*|
            .*\.example|
            .*\.example\..*|
            \.github/dependabot\.yml|
            .*requirements\.ya?ml
          )$
      - id: insert-license
        name: insert-license (Go)
        args:
          - --license-filepath=.github/license-headers/header.txt
          - --comment-style=//
        files: '\.go$'
        exclude: |
          (?x)^(
            docs/example-template/.*
          )$
      - id: insert-license
        name: insert-license (HTML)
        args:
          - --license-filepath=.github/license-headers/header.txt
          - --comment-style=<!--|  |-->
          - --insert-license-after-regex=^<!DOCTYPE html>$
        files: '\.html$'
