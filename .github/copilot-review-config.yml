review:
  auto_review: true

  instructions:
    - "Python code must follow ruff conventions (line-length 99, target py311)."
    - "Never commit secrets, passwords, or API tokens."
    - "All new Python code should have type hints."

  path_instructions:
    - path: ".github/**"
      instructions: >-
        Review for CI security: no secret leaks in workflow files,
        least-privilege permissions on each job, and pinned action
        versions (major tags like @v4, not @main).
