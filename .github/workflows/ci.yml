name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install executor dev deps
        run: pip install -e ".[dev]"
        working-directory: yaml-workflows/executor

      - name: Ruff lint — executor
        run: ruff check yaml-workflows/executor/orchestrio/

      - name: Ruff lint — Python examples
        run: ruff check python/

      - name: Ruff format check
        run: ruff format --check yaml-workflows/executor/ python/

      - name: Verify example directories have READMEs
        run: |
          ERRORS=0
          for dir in python ansible terraform; do
            if [ ! -f "$dir/README.md" ]; then
              echo "::error::Missing README.md in $dir/"
              ERRORS=$((ERRORS + 1))
            else
              echo "  OK  $dir/README.md"
            fi
          done
          [ "$ERRORS" -eq 0 ] || exit 1

  test:
    name: Test (executor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install executor dev deps
        run: pip install -e ".[dev]"
        working-directory: yaml-workflows/executor

      - name: Run tests
        run: pytest -v
        working-directory: yaml-workflows/executor

  schema-validate:
    name: Validate YAML schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install schema deps
        run: pip install pyyaml jsonschema

      - name: Validate workflow YAML against schema
        run: python .github/scripts/validate-schema.py
