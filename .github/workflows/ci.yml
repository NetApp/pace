name: CI — Orchestrio Executor

on:
  push:
    branches: [main]
    paths:
      - "yaml-workflows/executor/**"
      - "yaml-workflows/workflow-spec/**"
  pull_request:
    branches: [main]
    paths:
      - "yaml-workflows/executor/**"
      - "yaml-workflows/workflow-spec/**"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: yaml-workflows/executor

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check orchestrio/

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -v
