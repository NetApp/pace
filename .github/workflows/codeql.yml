name: CodeQL

# Static analysis for the two compiled/interpreted languages in the repo.
# Ansible and Terraform are not CodeQL-supported languages; their checks live
# in validate-examples.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          # Go's module lives at go/go.mod (not the repo root), so CodeQL's
          # autobuilder can't discover it on its own — hence "Go files were
          # found but not processed" under Default Setup. build-mode: manual
          # plus the explicit `go build ./...` step below (scoped to go/)
          # fixes that.
          - language: go
            build-mode: manual

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Only Go needs an explicit build (build-mode: manual); Python is
      # interpreted (build-mode: none) and skips this step entirely.
      - name: Build Go module
        if: matrix.language == 'go'
        working-directory: go
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
