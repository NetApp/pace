name: Catalog site

on:
  push:
    branches: [main]
    paths:
      - catalog.yaml
      - scripts/catalog/**
      - .github/workflows/catalog-site.yml
  pull_request:
    branches: [main]
    paths:
      - catalog.yaml
      - scripts/catalog/**
      - .github/workflows/catalog-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: generate-catalog-site
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Validate example catalog
        run: python scripts/validate_catalog.py

      - name: Generate Catalog Explorer
        run: python scripts/catalog/build_catalog_site.py

  publish:
    name: generate-and-commit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Validate example catalog
        run: python scripts/validate_catalog.py

      - name: Generate Catalog Explorer
        run: python scripts/catalog/build_catalog_site.py

      - name: Commit regenerated catalog site
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v5.2.0
        with:
          commit_message: "chore: regenerate catalog explorer"
          file_pattern: docs/catalog/**
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
