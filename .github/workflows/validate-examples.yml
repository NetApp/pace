name: Validate Automation Examples

on:
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "ansible/**"
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "python/**"
      - "ansible/**"
      - "terraform/**"

permissions:
  contents: read

jobs:
  # ── Python examples: compile + ruff lint + format check ──────
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.3"

      - name: Compile check Python examples
        run: python -m py_compile python/*.py

      - name: Lint Python examples
        run: ruff check python/

      - name: Format check Python examples
        run: ruff format --check python/

  # ── Ansible examples: syntax check + ansible-lint ────────────
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ansible and ansible-lint
        run: pip install ansible ansible-lint

      - name: Install NetApp ONTAP collection
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Syntax check playbooks
        run: |
          for f in ansible/*.yml; do
            [ "$(basename "$f")" = "requirements.yml" ] && continue
            echo "Checking $f …"
            ansible-playbook --syntax-check "$f" -i ansible/inventory/hosts.yml
          done

      - name: Run ansible-lint
        run: ansible-lint ansible/*.yml --exclude ansible/requirements.yml

  # ── Terraform examples: fmt + validate + tflint ──────────────
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Format check, validate, and lint Terraform examples
        run: |
          ERRORS=0
          for dir in terraform/*/; do
            echo "=== $(basename "$dir") ==="

            echo "  fmt check …"
            if ! terraform -chdir="$dir" fmt -check; then
              echo "  FAIL: terraform fmt"
              ERRORS=$((ERRORS + 1))
            fi

            echo "  init …"
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null 2>&1 || true

            echo "  validate …"
            if ! terraform -chdir="$dir" validate; then
              echo "  FAIL: terraform validate"
              ERRORS=$((ERRORS + 1))
            fi

            echo "  tflint …"
            if ! tflint --chdir="$dir" --no-color; then
              echo "  WARN: tflint reported issues"
            fi

            echo ""
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "$ERRORS Terraform check(s) failed"
            exit 1
          fi
