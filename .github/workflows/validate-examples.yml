name: Validate Automation Examples

on:
  pull_request:
    branches: [main]
    paths:
      - "automation-examples/**"
  push:
    branches: [main]
    paths:
      - "automation-examples/**"

permissions:
  contents: read

jobs:
  # ── Python examples: ruff lint + format check ────────────────
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.3

      - name: Lint Python examples
        run: ruff check automation-examples/python/

      - name: Format check Python examples
        run: ruff format --check automation-examples/python/

  # ── Ansible examples: syntax check + ansible-lint ────────────
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Ansible and ansible-lint
        run: pip install ansible ansible-lint

      - name: Install NetApp ONTAP collection
        run: ansible-galaxy collection install -r automation-examples/ansible/requirements.yml

      - name: Syntax check playbooks
        run: |
          for f in automation-examples/ansible/*.yml; do
            # Skip requirements.yml — it is not a playbook
            [ "$(basename "$f")" = "requirements.yml" ] && continue
            echo "Checking $f …"
            ansible-playbook --syntax-check "$f" -i automation-examples/ansible/inventory/hosts.yml
          done

      - name: Run ansible-lint
        run: ansible-lint automation-examples/ansible/*.yml --exclude automation-examples/ansible/requirements.yml
        continue-on-error: true

  # ── Terraform examples: fmt check + validate ─────────────────
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.7"

      - name: Format check and validate Terraform examples
        run: |
          ERRORS=0
          for dir in automation-examples/terraform/*/; do
            echo "=== $(basename "$dir") ==="

            echo "  fmt check …"
            if ! terraform -chdir="$dir" fmt -check; then
              echo "  FAIL: terraform fmt"
              ERRORS=$((ERRORS + 1))
            fi

            echo "  init …"
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null 2>&1 || true

            echo "  validate …"
            if ! terraform -chdir="$dir" validate; then
              echo "  FAIL: terraform validate"
              ERRORS=$((ERRORS + 1))
            fi

            echo ""
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "$ERRORS Terraform check(s) failed"
            exit 1
          fi
