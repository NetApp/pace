name: PR Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --only-verified

  yaml-syntax:
    name: Validate YAML syntax
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Check changed YAML files
        run: |
          CHANGED_YAML=$(git diff --name-only --diff-filter=ACM origin/main...HEAD \
            | grep '\.ya\?ml$' || true)

          if [ -z "$CHANGED_YAML" ]; then
            echo "No YAML files changed"
            exit 0
          fi

          pip install -q -r requirements-dev.txt

          ERRORS=0
          while IFS= read -r f; do
            if ! python -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null; then
              echo "::error file=$f::YAML syntax error in $f"
              ERRORS=$((ERRORS + 1))
            else
              echo "  OK  $f"
            fi
          done <<< "$CHANGED_YAML"

          [ "$ERRORS" -eq 0 ] || exit 1
