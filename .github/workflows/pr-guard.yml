name: PR Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6 # v3.94.3
        with:
          extra_args: --only-verified --fail

  yaml-syntax:
    name: Validate YAML syntax
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Check changed YAML files
        run: |
          CHANGED_YAML=$(git diff --name-only --diff-filter=ACM origin/main...HEAD \
            | grep '\.ya\?ml$' || true)

          if [ -z "$CHANGED_YAML" ]; then
            echo "No YAML files changed"
            exit 0
          fi

          pip install -q pyyaml

          ERRORS=0
          while IFS= read -r f; do
            if ! python -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null; then
              echo "::error file=$f::YAML syntax error in $f"
              ERRORS=$((ERRORS + 1))
            else
              echo "  OK  $f"
            fi
          done <<< "$CHANGED_YAML"

          [ "$ERRORS" -eq 0 ] || exit 1
