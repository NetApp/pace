name: Bug report
description: Something in a Pace example does not work as documented
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more reproduction
        detail you can paste, the faster we can fix it.

  - type: dropdown
    id: example
    attributes:
      label: Which example?
      description: The file or module the bug shows up in.
      options:
        - python/cluster_info.py
        - python/cluster_setup_basic.py
        - python/cifs_provision.py
        - python/nfs_provision.py
        - python/snapmirror_provision_src_managed.py
        - python/snapmirror_provision_dest_managed.py
        - python/snapmirror_test_failover.py
        - python/snapmirror_cleanup_test_failover.py
        - ansible/cluster_info.yml
        - ansible/cluster_setup.yml
        - ansible/cifs_provision.yml
        - ansible/nfs_provision.yml
        - ansible/snapmirror_provision_src_managed.yml
        - ansible/snapmirror_provision_dest_managed.yml
        - ansible/snapmirror_test_failover.yml
        - ansible/snapmirror_cleanup_test_failover.yml
        - terraform/cluster-info
        - terraform/cifs-provision
        - terraform/nfs-provision
        - Other (describe in summary)
    validations:
      required: true

  - type: input
    id: ontap_version
    attributes:
      label: ONTAP version
      description: Output of `cluster show -fields version` or `/api/cluster`.
      placeholder: "9.14.1P3"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - ONTAP Simulator
        - ONTAP Select
        - Real ONTAP cluster
        - Cloud Volumes ONTAP
        - Other (describe in summary)
    validations:
      required: true

  - type: input
    id: os_versions
    attributes:
      label: Local OS and tool versions
      description: e.g. "macOS 15.2 / Python 3.12.3 / Ansible 2.16 / Terraform 1.7.5"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: Paste the exact invocation. Redact secrets.
      render: bash
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output / error
      description: Paste the relevant output. Include exit code or PLAY RECAP / Apply summary if applicable.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs with `-v` / `TF_LOG=DEBUG`, stack traces, screenshots — anything that helps.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Sanity checks
      options:
        - label: I checked the [troubleshooting guide](https://github.com/NetApp/pace/blob/main/docs/troubleshooting.md).
          required: true
        - label: I searched [existing issues](https://github.com/NetApp/pace/issues?q=is%3Aissue) for duplicates.
          required: true
