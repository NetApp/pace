version: 2
updates:
  # Grouped so a week's worth of action bumps lands as one PR instead of
  # one PR per action (5 separate PRs landed in the same minute otherwise).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # Pinned CI tooling. Without this the pins in requirements-dev.txt would go
  # stale, trading a surprise breakage for silent staleness.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-tooling:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "pip"
    directory: "/python/ontap"
    schedule:
      interval: "weekly"
    groups:
      # Patch/minor bumps batch together; majors stay ungrouped so a
      # breaking runtime-dependency change still gets its own reviewed PR.
      ontap-runtime-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "terraform"
    directory: "/terraform/ontap/cluster-info"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "terraform"
    directory: "/terraform/ontap/nfs-provision"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
