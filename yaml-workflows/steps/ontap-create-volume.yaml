# Reusable step: create an ONTAP FlexVol volume.
# Expects env: ONTAP_HOST, SVM_NAME, VOLUME_NAME, AGGR_NAME, VOLUME_SIZE
# Best used with defaults for auth (username/password/headers/verify_ssl).
# Override config.body.nas to set security_style or other NAS options.
name: create_volume
type: http
config:
  method: POST
  url: "https://{{ env.ONTAP_HOST }}/api/storage/volumes"
  headers:
    Content-Type: "application/json"
  timeout: 60
  body:
    name: "{{ env.VOLUME_NAME }}"
    svm:
      name: "{{ env.SVM_NAME }}"
    aggregates:
      - name: "{{ env.AGGR_NAME }}"
    size: "{{ env.VOLUME_SIZE }}"
    nas:
      path: "/{{ env.VOLUME_NAME }}"
