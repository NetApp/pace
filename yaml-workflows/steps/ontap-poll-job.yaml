# Reusable step: poll an ONTAP async job until completion.
# Override config.url to point to the specific job endpoint.
# Best used with defaults for auth (username/password/headers/verify_ssl).
name: poll_job
type: http
config:
  method: GET
  url: ""   # must be overridden per workflow
  timeout: 30
  poll:
    interval_seconds: 10
    until:
      field: state
      not_equals: running
