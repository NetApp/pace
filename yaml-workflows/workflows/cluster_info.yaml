name: cluster_info
version: "1"
description: >-
  Get cluster version and list all nodes with serial numbers.

env:
  ONTAP_HOST: ""       # override via --env-file or --env ONTAP_HOST=x
  ONTAP_USER: "admin"
  ONTAP_PASS: ""       # override via --env-file or --env ONTAP_PASS=x

# Shared config applied to every HTTP step — auth, headers, TLS.
defaults:
  http:
    headers:
      Accept: "application/hal+json"
      X-Dot-Client-App: "orchestrio"
    username: "{{ env.ONTAP_USER }}"
    password: "{{ env.ONTAP_PASS }}"
    timeout: 30
    verify_ssl: false

steps:

  # Step 1 — Get cluster version (reusable fragment)
  - include: ../steps/ontap_get_cluster.yaml

  # Print cluster name + version
  - name: print_version
    type: shell
    config:
      command: >-
        echo "Cluster: {{ steps.get_cluster.body.name }} — {{ steps.get_cluster.body.version.full }}"

  # Step 2 — Get all nodes with serial numbers (reusable fragment)
  - include: ../steps/ontap_get_nodes.yaml

  # Print node count
  - name: print_nodes
    type: shell
    config:
      command: echo "Nodes in cluster- {{ steps.get_nodes.body.num_records }}"
