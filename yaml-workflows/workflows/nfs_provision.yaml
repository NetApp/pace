name: nfs_volume_provision
version: "1"
description: >-
  Create an ONTAP FlexVol volume, create a dedicated NFS export policy,
  add a client rule to it, then assign the policy to the volume.
  Uses defaults for shared auth and includes for reusable steps.

# ── Inputs ────────────────────────────────────────────────────────
# VOLUME_NAME   — name of the new volume
# VOLUME_SIZE   — size string accepted by ONTAP REST (e.g. 100MB, 1GB)
# AGGR_NAME     — aggregate to place the volume on
# CLIENT_MATCH  — client IP / CIDR for the export-policy rule (e.g. 10.0.0.0/8)
env:
  ONTAP_HOST:   ""
  ONTAP_USER:   "admin"
  ONTAP_PASS:   ""
  SVM_NAME:     "vs0"
  VOLUME_NAME:  "vol_nfs_test_01"
  VOLUME_SIZE:  "100MB"
  AGGR_NAME:    ""
  CLIENT_MATCH: "0.0.0.0/0"

# ── Shared HTTP config ───────────────────────────────────────────
# Auth, headers, TLS — declared once, merged into every HTTP step.
defaults:
  http:
    headers:
      Accept:       "application/hal+json"
      X-Dot-Client-App: "orchestrio"
    username: "{{ env.ONTAP_USER }}"
    password: "{{ env.ONTAP_PASS }}"
    timeout: 30
    verify_ssl: false

steps:

  # ── Step 1 — Create volume (reusable fragment) ──────────────────
  - include: ../steps/ontap_create_volume.yaml

  # ── Step 2 — Poll volume-creation job until complete ────────────
  - include: ../steps/ontap_poll_job.yaml
    override:
      name: track_create_volume_job
      config:
        url: "https://{{ env.ONTAP_HOST }}/api/cluster/jobs/{{ steps.create_volume.body.job.uuid }}?fields=state,message&return_timeout=120"
        poll:
          interval_seconds: 5

  # ── Step 3 — Fetch the new volume UUID (reusable fragment) ──────
  - include: ../steps/ontap_get_volume.yaml

  # ── Step 4 — Create a dedicated export policy for this volume ───
  - name: create_export_policy
    type: http
    config:
      method: POST
      url: "https://{{ env.ONTAP_HOST }}/api/protocols/nfs/export-policies"
      headers:
        Content-Type: "application/json"
      body:
        name: "{{ env.VOLUME_NAME }}_export_policy"
        svm:
          name: "{{ env.SVM_NAME }}"

  # ── Step 5 — Fetch the new export policy id ─────────────────────
  - name: get_export_policy
    type: http
    config:
      method: GET
      url: "https://{{ env.ONTAP_HOST }}/api/protocols/nfs/export-policies?name={{ env.VOLUME_NAME }}_export_policy&svm.name={{ env.SVM_NAME }}&fields=name,id&return_timeout=30"

  # ── Step 6 — Add client rule to the export policy ───────────────
  - name: add_export_rule
    type: http
    config:
      method: POST
      url: "https://{{ env.ONTAP_HOST }}/api/protocols/nfs/export-policies/{{ steps.get_export_policy.body.records.0.id }}/rules"
      headers:
        Content-Type: "application/json"
      body:
        clients:
          - match: "{{ env.CLIENT_MATCH }}"
        ro_rule:
          - any
        rw_rule:
          - any
        superuser:
          - any

  # ── Step 7 — Assign the export policy to the volume (PATCH) ─────
  - name: assign_export_policy
    type: http
    config:
      method: PATCH
      url: "https://{{ env.ONTAP_HOST }}/api/storage/volumes/{{ steps.get_volume.body.records.0.uuid }}"
      headers:
        Content-Type: "application/json"
      body:
        nas:
          export_policy:
            name: "{{ env.VOLUME_NAME }}_export_policy"

  # ── Step 8 — Poll PATCH job until complete ──────────────────────
  - include: ../steps/ontap_poll_job.yaml
    override:
      name: track_assign_policy_job
      config:
        url: "https://{{ env.ONTAP_HOST }}/api/cluster/jobs/{{ steps.assign_export_policy.body.job.uuid }}?fields=state,message&return_timeout=120"
        poll:
          interval_seconds: 5

  # ── Step 9 — Print summary ───────────────────────────────────────
  - name: print_summary
    type: shell
    config:
      command: >-
        echo "✓ Volume '{{ env.VOLUME_NAME }}' ({{ env.VOLUME_SIZE }}) created on SVM '{{ env.SVM_NAME }}' | Mount path: /{{ env.VOLUME_NAME }} |
        Export policy '{{ env.VOLUME_NAME }}_export_policy' created with client rule '{{ env.CLIENT_MATCH }}' and assigned to volume"
