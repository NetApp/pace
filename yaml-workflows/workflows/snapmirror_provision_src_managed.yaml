name: snapmirror_provision_src_managed
version: "1"
description: >-
  SnapMirror Provision (Source-Managed View)
  =======================================================
  Full-cluster visibility workflow: verifies BOTH source and destination
  clusters before provisioning the SnapMirror DR relationship.

  This variant connects to the SOURCE cluster first to confirm the
  source volume exists and is healthy, then connects to the DESTINATION
  cluster to create the DP volume and SnapMirror relationship.

  NOTE: ONTAP requires SnapMirror relationships to be created from the
  DESTINATION cluster side. All relationship + volume create API calls
  in this workflow therefore target DEST_HOST, not SOURCE_HOST.

  Phase A  Source pre-flight      - Verify source cluster + volume
  Phase B  Dest pre-flight        - Verify dest cluster + aggregate
  Phase C  Dest volume setup      - Auto-create DP volume if missing
  Phase D  Relationship setup     - Create + initialize SnapMirror
  Phase E  Convergence polling    - Wait for snapmirrored state
  Phase F  Final validation       - Health check + report

  Inputs  (edit env section below)
  --------
  SOURCE_HOST    source cluster management IP
  SOURCE_SVM     source SVM name
  SOURCE_VOLUME  source volume name
  DEST_HOST      destination cluster management IP
  DEST_SVM       destination SVM name
  SM_POLICY      SnapMirror policy name  (default: Asynchronous)

  DEST_VOLUME is auto-derived as  SOURCE_VOLUME + "_dest"  - no entry needed.

  Run:
  orchestrio run snapmirror_provision_src_managed.yaml

env:
  # ----------------------------------------------------------------
  # INPUT PARAMETERS  <-- edit these before running
  # ----------------------------------------------------------------
  SOURCE_HOST:    ""   # source cluster management IP
  SOURCE_SVM:     ""   # source SVM name
  SOURCE_VOLUME:  ""   # source volume name  <-- only this needs to be set
  DEST_HOST:      ""   # destination cluster management IP
  DEST_SVM:       ""   # destination SVM name
  SM_POLICY:      "Asynchronous"     # SnapMirror policy
  # DEST_VOLUME is auto-derived as  SOURCE_VOLUME + "_dest"  - no entry needed

  # ----------------------------------------------------------------
  # CREDENTIALS
  # ----------------------------------------------------------------
  SOURCE_USER: ""   # source cluster admin username
  SOURCE_PASS: ""   # source cluster admin password
  DEST_USER:   ""   # destination cluster admin username
  DEST_PASS:   ""   # destination cluster admin password

# ── Shared HTTP defaults ────────────────────────────────────────────
# Merged into every http step; step-level values always win.
# Note: credentials are NOT in defaults because source/dest steps use
# different accounts (SOURCE_USER/PASS vs DEST_USER/PASS).
defaults:
  http:
    headers:
      Accept: "application/hal+json"
      X-Dot-Client-App: "orchestrio"
    verify_ssl: true
    timeout: 30

steps:

  # ================================================================
  # PHASE A - SOURCE CLUSTER PRE-FLIGHT
  # ================================================================

  # Step A1 - Verify source cluster is reachable
  - name: verify_source_cluster
    type: http
    config:
      method: GET
      url: "https://{{ env.SOURCE_HOST }}/api/cluster?fields=name,version&return_timeout=120"
      username: "{{ env.SOURCE_USER }}"
      password: "{{ env.SOURCE_PASS }}"
    retry:
      attempts: 3
      delay_seconds: 10

  - name: print_source_cluster
    type: shell
    config:
      command: |
        echo "=== SnapMirror Provision (Source-Managed) ==="
        echo "SOURCE CLUSTER | name={{ steps.verify_source_cluster.body.name }} | ontap={{ steps.verify_source_cluster.body.version.full }}"

  # Step A2 - Verify source volume exists on source cluster
  - name: check_source_volume
    type: http
    config:
      method: GET
      url: "https://{{ env.SOURCE_HOST }}/api/storage/volumes?max_records=1&name={{ env.SOURCE_VOLUME }}&svm.name={{ env.SOURCE_SVM }}&fields=name,uuid,state,type,space.size&return_timeout=120"
      username: "{{ env.SOURCE_USER }}"
      password: "{{ env.SOURCE_PASS }}"

  - name: print_source_volume
    type: shell
    config:
      command: |
        echo "SOURCE VOLUME  | name={{ steps.check_source_volume.body.records.0.name }} | uuid={{ steps.check_source_volume.body.records.0.uuid }} | state={{ steps.check_source_volume.body.records.0.state }} | type={{ steps.check_source_volume.body.records.0.type }} | size={{ steps.check_source_volume.body.records.0.space.size }}"

  # Guard A - Abort immediately if source volume not found or is already a DP destination
  - name: guard_source_volume
    type: shell
    on_failure: stop
    config:
      command: |
        if [ "{{ steps.check_source_volume.body.num_records }}" = "0" ]; then
          echo "PROVISION ABORTED - source volume not found: {{ env.SOURCE_VOLUME }} on {{ env.SOURCE_HOST }}"
          exit 1
        elif [ "{{ steps.check_source_volume.body.records.0.type }}" = "dp" ]; then
          echo "PROVISION ABORTED - {{ env.SOURCE_SVM }}:{{ env.SOURCE_VOLUME }} is type=dp, specify the source RW volume"
          exit 1
        else
          echo "SOURCE VOLUME OK - {{ env.SOURCE_SVM }}:{{ env.SOURCE_VOLUME }}"
        fi

  # Step A3 - Get source cluster name as registered in DEST cluster's peer list
  #            (must query DEST peers because the relationship create runs on DEST)
  - name: get_cluster_peer_name
    type: http
    config:
      method: GET
      url: "https://{{ env.DEST_HOST }}/api/cluster/peers?fields=name,status.state&max_records=1&return_timeout=120"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"

  # ================================================================
  # PHASE B - DESTINATION CLUSTER PRE-FLIGHT
  # ================================================================

  # Step B1 - Verify destination cluster is reachable
  - name: verify_dest_cluster
    type: http
    config:
      method: GET
      url: "https://{{ env.DEST_HOST }}/api/cluster?fields=name,version&return_timeout=120"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"
    retry:
      attempts: 3
      delay_seconds: 10

  - name: print_dest_cluster
    type: shell
    config:
      command: |
        echo "DEST CLUSTER   | name={{ steps.verify_dest_cluster.body.name }} | ontap={{ steps.verify_dest_cluster.body.version.full }}"

  # Step B2 - Find a usable aggregate on the destination SVM for volume creation
  - name: get_dest_aggregate
    type: http
    config:
      method: GET
      url: "https://{{ env.DEST_HOST }}/api/storage/aggregates?max_records=1&fields=name,space.block_storage.available&return_timeout=120"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"

  # ================================================================
  # PHASE C - DESTINATION VOLUME SETUP (auto-create if missing)
  # ================================================================

  # Step C1 - Check if dest DP volume already exists
  - name: check_dest_volume
    type: http
    config:
      method: GET
      url: "https://{{ env.DEST_HOST }}/api/storage/volumes?max_records=1&name={{ env.SOURCE_VOLUME }}_dest&svm.name={{ env.DEST_SVM }}&fields=name,uuid,state,type&return_timeout=120"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"

  # Step C2 - Create dest DP volume if it does not exist (on_failure: continue = skip 409 Conflict on re-runs)
  - name: create_dest_volume
    type: http
    on_failure: continue
    config:
      method: POST
      url: "https://{{ env.DEST_HOST }}/api/storage/volumes?return_timeout=120"
      headers:
        Content-Type: "application/json"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"
      timeout: 120
      body:
        name: "{{ env.SOURCE_VOLUME }}_dest"
        svm:
          name: "{{ env.DEST_SVM }}"
        aggregates:
          - name: "{{ steps.get_dest_aggregate.body.records.0.name }}"
        size: "{{ steps.check_source_volume.body.records.0.space.size }}"
        type: "dp"

  - name: print_dest_volume_created
    type: shell
    config:
      command: |
        echo "DEST DP VOLUME | name={{ env.SOURCE_VOLUME }}_dest | svm={{ env.DEST_SVM }} | aggregate={{ steps.get_dest_aggregate.body.records.0.name }} | (created or already existed)"

  # Step C3 - Re-query dest volume to get the UUID (needed for relationship URL)
  - name: get_dest_volume
    type: http
    config:
      method: GET
      url: "https://{{ env.DEST_HOST }}/api/storage/volumes?max_records=1&name={{ env.SOURCE_VOLUME }}_dest&svm.name={{ env.DEST_SVM }}&fields=name,uuid,state,type&return_timeout=120"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"

  - name: print_dest_volume
    type: shell
    config:
      command: |
        echo "DEST DP VOLUME | name={{ steps.get_dest_volume.body.records.0.name }} | uuid={{ steps.get_dest_volume.body.records.0.uuid }} | state={{ steps.get_dest_volume.body.records.0.state }} | type={{ steps.get_dest_volume.body.records.0.type }}"

  # ================================================================
  # PHASE D - SNAPMIRROR RELATIONSHIP SETUP
  # ================================================================

  # Step D1 - Check if relationship already exists (idempotent guard)
  - name: check_existing_relationship
    type: http
    config:
      method: GET
      url: "https://{{ env.DEST_HOST }}/api/snapmirror/relationships?destination.path={{ env.DEST_SVM }}:{{ env.SOURCE_VOLUME }}_dest&fields=uuid,state,healthy&max_records=1&return_timeout=120"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"

  - name: print_relationship_check
    type: shell
    config:
      command: |
        echo "RELATIONSHIP CHECK | existing_count={{ steps.check_existing_relationship.body.num_records }} | source={{ env.SOURCE_SVM }}:{{ env.SOURCE_VOLUME }} | dest={{ env.DEST_SVM }}:{{ env.SOURCE_VOLUME }}_dest"

  # Guard D - Notify if already provisioned (create steps are safe to re-run via on_failure:continue)
  - name: guard_already_provisioned
    type: shell
    on_failure: continue
    config:
      command: |
        echo "RELATIONSHIP CHECK | existing={{ steps.check_existing_relationship.body.num_records }} | uuid={{ steps.check_existing_relationship.body.records.0.uuid }} | state={{ steps.check_existing_relationship.body.records.0.state }} | healthy={{ steps.check_existing_relationship.body.records.0.healthy }}"

  # Step D2 - Create + initialize SnapMirror relationship from DEST cluster (ONTAP requirement)
  - name: create_and_initialize_relationship
    type: http
    on_failure: continue
    config:
      method: POST
      url: "https://{{ env.DEST_HOST }}/api/snapmirror/relationships?return_timeout=120"
      headers:
        Content-Type: "application/json"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"
      timeout: 120
      body:
        source:
          path: "{{ env.SOURCE_SVM }}:{{ env.SOURCE_VOLUME }}"
          cluster:
            name: "{{ steps.get_cluster_peer_name.body.records.0.name }}"
        destination:
          path: "{{ env.DEST_SVM }}:{{ env.SOURCE_VOLUME }}_dest"
        policy:
          name: "{{ env.SM_POLICY }}"

  - name: print_create_submitted
    type: shell
    config:
      command: |
        echo "RELATIONSHIP CREATE | submitted from DEST cluster {{ env.DEST_HOST }} | source={{ env.SOURCE_SVM }}:{{ env.SOURCE_VOLUME }} | dest={{ env.DEST_SVM }}:{{ env.SOURCE_VOLUME }}_dest | policy={{ env.SM_POLICY }}"

  # Step D3 - Poll create+initialize async job to completion
  - name: poll_create_init_job
    type: http
    on_failure: continue
    config:
      method: GET
      url: "https://{{ env.DEST_HOST }}/api/cluster/jobs/{{ steps.create_and_initialize_relationship.body.job.uuid }}?fields=state,message,error,code&return_timeout=120"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"
      timeout: 600
      poll:
        interval_seconds: 10
        until:
          field: state
          not_equals: running

  # ================================================================
  # PHASE E - CONVERGENCE POLLING
  # ================================================================

  # Step E1 - Retrieve the relationship UUID
  - name: get_sm_relationship
    type: http
    config:
      method: GET
      url: "https://{{ env.DEST_HOST }}/api/snapmirror/relationships?destination.path={{ env.DEST_SVM }}:{{ env.SOURCE_VOLUME }}_dest&fields=uuid,source.path,destination.path,state,lag_time,healthy,policy.name&max_records=1&return_timeout=120"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"
    retry:
      attempts: 5
      delay_seconds: 10

  - name: print_relationship_found
    type: shell
    config:
      command: |
        echo "RELATIONSHIP FOUND | uuid={{ steps.get_sm_relationship.body.records.0.uuid }} | state={{ steps.get_sm_relationship.body.records.0.state }} | healthy={{ steps.get_sm_relationship.body.records.0.healthy }}"

  # Step E2 - Trigger baseline transfer to initialize the relationship
  #            ONTAP 9.19.1 uses POST /transfers (not /initialize)
  - name: initialize_relationship
    type: http
    on_failure: continue
    config:
      method: POST
      url: "https://{{ env.DEST_HOST }}/api/snapmirror/relationships/{{ steps.get_sm_relationship.body.records.0.uuid }}/transfers?return_timeout=120"
      headers:
        Content-Type: "application/json"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"
      timeout: 120
      body: {}

  # Step E3 - Wait until relationship reaches snapmirrored state
  - name: wait_for_snapmirrored
    type: http
    config:
      method: GET
      url: "https://{{ env.DEST_HOST }}/api/snapmirror/relationships/{{ steps.get_sm_relationship.body.records.0.uuid }}?fields=state,lag_time,healthy&return_timeout=120"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"
      timeout: 3600
      poll:
        interval_seconds: 20
        until:
          field: state
          equals: snapmirrored
    retry:
      attempts: 3
      delay_seconds: 20

  # ================================================================
  # PHASE F - FINAL VALIDATION
  # ================================================================

  # Step F1 - Authoritative final health check
  - name: validate_health
    type: http
    config:
      method: GET
      url: "https://{{ env.DEST_HOST }}/api/snapmirror/relationships/{{ steps.get_sm_relationship.body.records.0.uuid }}?fields=uuid,source.path,destination.path,state,lag_time,healthy,policy.name&return_timeout=120"
      username: "{{ env.DEST_USER }}"
      password: "{{ env.DEST_PASS }}"

  # Step F2 - Final report
  - name: print_final_report
    type: shell
    config:
      command: |
        echo "=== PROVISION COMPLETE ==="
        echo "  SOURCE cluster  : {{ steps.verify_source_cluster.body.name }} ({{ env.SOURCE_HOST }})"
        echo "  DEST cluster    : {{ steps.verify_dest_cluster.body.name }} ({{ env.DEST_HOST }})"
        echo "  Source volume   : {{ env.SOURCE_SVM }}:{{ env.SOURCE_VOLUME }}"
        echo "  Dest volume     : {{ env.DEST_SVM }}:{{ env.SOURCE_VOLUME }}_dest"
        echo "  State           : {{ steps.validate_health.body.state }}"
        echo "  Healthy         : {{ steps.validate_health.body.healthy }}"
        echo "  Lag Time        : {{ steps.validate_health.body.lag_time }}"
        echo "  Policy          : {{ steps.validate_health.body.policy.name }}"
