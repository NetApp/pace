name: cleanup_test_failover
version: "1"
description: >-
  SnapMirror Test Failover Cleanup
  ====================================================================
  Safely removes a FlexClone test-failover volume created by test_failover.yaml.

  The cleanup identifies the correct clone via the SnapMirror relationship:
    1. Takes SOURCE_VOLUME + SOURCE_SVM as input (same as provision workflow)
    2. Searches both clusters for the SM relationship matching that source path
    3. Retrieves the relationship UUID from the destination cluster
    4. Finds clone volumes tagged with "<uuid>:test" - only clones created
       by test_failover.yaml carry this tag; manually created volumes are safe
    5. Deletes only the tagged clone

  Phase 0  Relationship-pick  - Find SM relationship on correct cluster via source.path
  Phase A  Tag-based find     - Locate clone tagged with "<uuid>:test"
  Phase B  Prepare            - Unmount + offline the clone
  Phase C  Delete             - Delete the clone and confirm removal

  Run:
  orchestrio run cleanup_test_failover.yaml

env:
  # ----------------------------------------------------------------
  # BOTH CLUSTER IPs - the workflow picks the right one automatically
  # ----------------------------------------------------------------
  CLUSTER_A: ""   # destination cluster A management IP
  CLUSTER_B: ""   # destination cluster B management IP

  # ----------------------------------------------------------------
  # SOURCE VOLUME DETAILS  (same inputs as provision / test_failover)
  # The workflow resolves the SM relationship for this source, then
  # finds and deletes ONLY the clone tagged by test_failover.yaml.
  # ----------------------------------------------------------------
  SOURCE_VOLUME: ""   # source volume name  (e.g. "vol_12")
  SOURCE_SVM:    ""   # source SVM name     (e.g. "vs1")

  # ----------------------------------------------------------------
  # CREDENTIALS (same on both clusters)
  # ----------------------------------------------------------------
  DEST_USER: ""   # cluster admin username
  DEST_PASS: ""   # cluster admin password

# ── Shared HTTP defaults ────────────────────────────────────────────
# All http steps use the same cluster credentials; merged here once.
defaults:
  http:
    headers:
      Accept: "application/hal+json"
      X-Dot-Client-App: "orchestrio"
    username: "{{ env.DEST_USER }}"
    password: "{{ env.DEST_PASS }}"
    verify_ssl: true
    timeout: 30

steps:

  # ================================================================
  # PHASE 0 - FIND SM RELATIONSHIP ON THE CORRECT CLUSTER
  # Query both clusters for a relationship where source.path matches
  # SOURCE_SVM:SOURCE_VOLUME.  The cluster that has the match is the
  # DESTINATION cluster - that is where the clone will also live.
  # ================================================================

  # Step 0a - Query CLUSTER_A for SM relationship matching source path
  - name: get_rel_cluster_a
    type: http
    on_failure: continue
    config:
      method: GET
      url: "https://{{ env.CLUSTER_A }}/api/snapmirror/relationships?source.path={{ env.SOURCE_SVM }}:{{ env.SOURCE_VOLUME }}&fields=uuid,source.path,destination.path,state&max_records=1&return_timeout=60"
      timeout: 20

  # Step 0b - Query CLUSTER_B for SM relationship matching source path
  - name: get_rel_cluster_b
    type: http
    on_failure: continue
    config:
      method: GET
      url: "https://{{ env.CLUSTER_B }}/api/snapmirror/relationships?source.path={{ env.SOURCE_SVM }}:{{ env.SOURCE_VOLUME }}&fields=uuid,source.path,destination.path,state&max_records=1&return_timeout=60"
      timeout: 20

  # Step 0c - Pick the cluster that has the relationship; emit its IP
  - name: pick_dest_cluster
    type: shell
    on_failure: continue
    config:
      timeout: 10
      command: |
        if [ "{{ steps.get_rel_cluster_b.body.num_records }}" = "1" ]; then
          echo "{{ env.CLUSTER_B }}"
        elif [ "{{ steps.get_rel_cluster_a.body.num_records }}" = "1" ]; then
          echo "{{ env.CLUSTER_A }}"
        else
          exit 1
        fi

  # Step 0d - Get full relationship details (including UUID) from the winning cluster
  - name: get_sm_relationship
    type: http
    on_failure: continue
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/snapmirror/relationships?source.path={{ env.SOURCE_SVM }}:{{ env.SOURCE_VOLUME }}&fields=uuid,source.path,destination.path,state,healthy&max_records=1&return_timeout=120"

  - name: print_relationship_found
    type: shell
    on_failure: continue
    config:
      command: |
        echo "=== RELATIONSHIP FOUND ==="
        echo "  Cluster : {{ steps.pick_dest_cluster.stdout }}"
        echo "  UUID    : {{ steps.get_sm_relationship.body.records.0.uuid }}"
        echo "  Source  : {{ steps.get_sm_relationship.body.records.0.source.path }}"
        echo "  Dest    : {{ steps.get_sm_relationship.body.records.0.destination.path }}"
        echo "  State   : {{ steps.get_sm_relationship.body.records.0.state }}"
        echo "  Healthy : {{ steps.get_sm_relationship.body.records.0.healthy }}"

  # Guard - abort if relationship is not in snapmirrored state or unhealthy
  - name: guard_relationship_healthy
    type: shell
    on_failure: continue
    config:
      command: |
        if [ "{{ steps.get_sm_relationship.body.records.0.state }}" != "snapmirrored" ]; then
          echo "RELATIONSHIP NOT HEALTHY - state={{ steps.get_sm_relationship.body.records.0.state }} healthy={{ steps.get_sm_relationship.body.records.0.healthy }}"
          exit 1
        else
          echo "RELATIONSHIP OK - state={{ steps.get_sm_relationship.body.records.0.state }} healthy={{ steps.get_sm_relationship.body.records.0.healthy }}"
        fi

  # ================================================================
  # PHASE A - TAG-BASED CLONE DISCOVERY
  # Find the clone volume tagged with "<sm_uuid>:test".
  # Only clones created by test_failover.yaml carry this tag -
  # manually created volumes are never matched or deleted.
  # ================================================================

  # Step A1 - Search for volumes tagged with the relationship UUID
  - name: find_tagged_clone
    type: http
    on_failure: continue
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/storage/volumes?_tags={{ steps.get_sm_relationship.body.records.0.uuid }}:test&fields=name,uuid,svm.name,state,nas.path&max_records=1&return_timeout=120"

  # Step A2 - Guard: exit 1 if no tagged clone found (banner printed in print_done)
  - name: print_clone_found
    type: shell
    on_failure: continue
    config:
      command: |
        if [ "{{ steps.find_tagged_clone.body.num_records }}" = "0" ]; then
          echo "NO TAGGED CLONE FOUND for {{ env.SOURCE_SVM }}:{{ env.SOURCE_VOLUME }} on {{ steps.pick_dest_cluster.stdout }}"
          exit 1
        else
          echo "CLONE FOUND - {{ steps.find_tagged_clone.body.records.0.name }} svm={{ steps.find_tagged_clone.body.records.0.svm.name }} cluster={{ steps.pick_dest_cluster.stdout }}"
        fi

  # ================================================================
  # PHASE B - PREPARE FOR DELETION (unmount + offline)
  # ================================================================

  # Step B1 - Unmount the clone (clear junction path)
  - name: unmount_clone
    type: http
    on_failure: continue
    config:
      method: PATCH
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/storage/volumes/{{ steps.find_tagged_clone.body.records.0.uuid }}?return_timeout=120"
      headers:
        Content-Type: "application/json"
      timeout: 60
      body:
        nas:
          path: ""

  # Step B2 - Poll unmount async job
  - name: poll_unmount_job
    type: http
    on_failure: continue
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/cluster/jobs/{{ steps.unmount_clone.body.job.uuid }}?fields=state,message,error,code&return_timeout=120"
      timeout: 300
      poll:
        interval_seconds: 5
        until:
          field: state
          not_equals: running

  # Step B3 - Offline the clone volume
  - name: offline_clone
    type: http
    on_failure: continue
    config:
      method: PATCH
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/storage/volumes/{{ steps.find_tagged_clone.body.records.0.uuid }}?return_timeout=120"
      headers:
        Content-Type: "application/json"
      timeout: 60
      body:
        state: "offline"

  # Step B4 - Poll offline async job
  - name: poll_offline_job
    type: http
    on_failure: continue
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/cluster/jobs/{{ steps.offline_clone.body.job.uuid }}?fields=state,message,error,code&return_timeout=120"
      timeout: 300
      poll:
        interval_seconds: 5
        until:
          field: state
          not_equals: running

  # ================================================================
  # PHASE C - DELETE CLONE
  # ================================================================

  # Step C1 - Delete the clone volume
  - name: delete_clone
    type: http
    on_failure: continue
    config:
      method: DELETE
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/storage/volumes/{{ steps.find_tagged_clone.body.records.0.uuid }}?return_timeout=120"
      timeout: 120

  # Step C2 - Poll delete async job
  - name: poll_delete_job
    type: http
    on_failure: continue
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/cluster/jobs/{{ steps.delete_clone.body.job.uuid }}?fields=state,message,error,code&return_timeout=120"
      timeout: 300
      poll:
        interval_seconds: 5
        until:
          field: state
          not_equals: running

  # Step C3 - Print final status
  - name: print_done
    type: shell
    on_failure: continue
    config:
      command: |
        echo "=== CLEANUP COMPLETE ==="
        echo "  Deleted   : {{ steps.find_tagged_clone.body.records.0.name }}"
        echo "  SVM       : {{ steps.find_tagged_clone.body.records.0.svm.name }}"
        echo "  Cluster   : {{ steps.pick_dest_cluster.stdout }}"
        echo "  SM Rel ID : {{ steps.get_sm_relationship.body.records.0.uuid }}"
