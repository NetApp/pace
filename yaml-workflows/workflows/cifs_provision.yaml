name: cifs_share_provision
version: "1"
description: >-
  Provision a CIFS (SMB) share on ONTAP: create a FlexVol volume with NTFS
  security style, create a CIFS share on it, and set the share ACL for a
  specified user/group — all in one automated workflow.
  Uses defaults for shared auth and includes for reusable steps.

# ── Inputs ────────────────────────────────────────────────────────
# VOLUME_NAME   — name of the new volume (share path = /<VOLUME_NAME>)
# VOLUME_SIZE   — size string accepted by ONTAP REST (e.g. 100MB, 1GB)
# AGGR_NAME     — aggregate to place the volume on
# SHARE_NAME    — SMB share name clients will connect to
# SHARE_COMMENT — optional share description
# ACL_USER      — Windows user or group to grant access (e.g. Everyone, DOMAIN\user)
# ACL_PERMISSION— share permission: no_access | read | change | full_control
env:
  ONTAP_HOST:     ""
  ONTAP_USER:     "admin"
  ONTAP_PASS:     ""
  SVM_NAME:       "vs0"
  VOLUME_NAME:    "cifs_test_env"
  VOLUME_SIZE:    "100MB"
  AGGR_NAME:      ""
  SHARE_NAME:     "cifs_share_demo"
  SHARE_COMMENT:  "Provisioned by orchestrio"
  ACL_USER:       "Everyone"
  ACL_PERMISSION: "full_control"

# ── Shared HTTP config ───────────────────────────────────────────
# Auth, headers, TLS — declared once, merged into every HTTP step.
defaults:
  http:
    headers:
      Accept:       "application/hal+json"
      X-Dot-Client-App: "orchestrio"
    username: "{{ env.ONTAP_USER }}"
    password: "{{ env.ONTAP_PASS }}"
    timeout: 30
    verify_ssl: false

steps:

  # ── Step 1 — Create FlexVol with NTFS security style ────────────
  #             Reuses the create_volume fragment; overrides nas block
  #             to set security_style: ntfs for CIFS.
  - include: ../steps/ontap_create_volume.yaml
    override:
      config:
        body:
          nas:
            security_style: "ntfs"
            path: "/{{ env.VOLUME_NAME }}"

  # ── Step 2 — Poll volume-creation job until complete ────────────
  - include: ../steps/ontap_poll_job.yaml
    override:
      name: track_create_volume_job
      config:
        url: "https://{{ env.ONTAP_HOST }}/api/cluster/jobs/{{ steps.create_volume.body.job.uuid }}?fields=state,message&return_timeout=120"
        poll:
          interval_seconds: 5

  # ── Step 3 — Print volume creation result ───────────────────────
  - name: print_volume_status
    type: shell
    config:
      command: >-
        echo "Volume '{{ env.VOLUME_NAME }}' job → {{ steps.track_create_volume_job.body.state }}: {{ steps.track_create_volume_job.body.message }}"

  # ── Step 4 — Create CIFS share on the volume ────────────────────
  - name: create_cifs_share
    type: http
    config:
      method: POST
      url: "https://{{ env.ONTAP_HOST }}/api/protocols/cifs/shares"
      headers:
        Content-Type: "application/json"
      body:
        name: "{{ env.SHARE_NAME }}"
        path: "/{{ env.VOLUME_NAME }}"
        svm:
          name: "{{ env.SVM_NAME }}"
        comment: "{{ env.SHARE_COMMENT }}"

  # ── Step 5 — Fetch SVM UUID (needed for ACL URL) ────────────────
  - name: get_svm
    type: http
    config:
      method: GET
      url: "https://{{ env.ONTAP_HOST }}/api/svm/svms?name={{ env.SVM_NAME }}&fields=name,uuid&return_timeout=30"

  # ── Step 6 — Set share ACL ──────────────────────────────────────
  # ONTAP auto-creates Everyone/full_control when the share is created.
  # We PATCH that entry to set the desired permission for ACL_USER.
  - name: set_share_acl
    type: http
    config:
      method: PATCH
      url: "https://{{ env.ONTAP_HOST }}/api/protocols/cifs/shares/{{ steps.get_svm.body.records.0.uuid }}/{{ env.SHARE_NAME }}/acls/{{ env.ACL_USER }}/windows"
      headers:
        Content-Type: "application/json"
      body:
        permission: "{{ env.ACL_PERMISSION }}"

  # ── Step 7 — Verify share + ACL ─────────────────────────────────
  - name: verify_share
    type: http
    config:
      method: GET
      url: "https://{{ env.ONTAP_HOST }}/api/protocols/cifs/shares/{{ steps.get_svm.body.records.0.uuid }}/{{ env.SHARE_NAME }}?fields=name,path,acls&return_timeout=30"

  # ── Step 8 — Print summary ───────────────────────────────────────
  - name: print_summary
    type: shell
    config:
      command: >-
        echo "✓ CIFS share '{{ env.SHARE_NAME }}' created on volume '{{ env.VOLUME_NAME }}' (SVM: {{ env.SVM_NAME }}) | Path: /{{ env.VOLUME_NAME }} | ACL: {{ env.ACL_USER }} → {{ env.ACL_PERMISSION }}"
