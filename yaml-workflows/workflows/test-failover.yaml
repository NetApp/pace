name: test-failover
version: "1"
description: >-
  SnapMirror Test Failover
  =======================================================================
  Performs a non-disruptive DR test by creating a writable FlexClone of a
  SnapMirror destination volume. Supports two modes:

  AUTO mode  (default)  - leave SOURCE_VOLUME as "*"
    Queries both clusters, picks the one with the most recently created
    DP volume, and runs the failover against it.

  TARGETED mode         - set SOURCE_VOLUME to a specific name e.g. "vol_9"
    Locates exactly vol_9_dest across both clusters and targets it.
    Optionally set SOURCE_SVM to restrict to a specific SVM.

  Phase 0  Cluster-pick - Query both clusters for target DP volume; pick winner
  Phase 0b Discovery    - Auto-find DP volume + SVM on the winning cluster
  Phase A  Pre-flight   - Verify dest cluster + relationship health
  Phase B  Snapshot     - Get latest SnapMirror snapshot on dest volume
  Phase C  Clone        - Create writable FlexClone (test failover volume)
  Phase D  Verify       - Confirm clone is online + tag it with SM relationship UUID
  Phase E  Resync       - Resync SnapMirror + validate healthy state

  Clone tagging: after creation the clone volume is PATCH-ed with
    _tags: ["<sm_relationship_uuid>:test"]
  This tag lets cleanup-test-failover.yaml identify ONLY workflow-created
  clones and safely ignore any manually created volumes.

  Run:
  orchestrio run test-failover.yaml

env:
  # ----------------------------------------------------------------
  # BOTH CLUSTER IPs - the workflow picks the right one automatically
  # ----------------------------------------------------------------
  CLUSTER_A: ""   # destination cluster A management IP
  CLUSTER_B: ""   # destination cluster B management IP

  # ----------------------------------------------------------------
  # OPTIONAL TARGET SELECTION
  # Set SOURCE_VOLUME to a specific source volume name to target that
  # exact DP volume (e.g. "vol_9" targets vol_9_dest).
  # Leave as "*" to auto-detect the most recently created DP volume.
  # Set SOURCE_SVM to restrict to a specific SVM, or leave as "*" for any.
  # ----------------------------------------------------------------
  SOURCE_VOLUME: ""   # "*" = auto-detect most recent  |  "vol_12" = target vol_12_dest
  SOURCE_SVM:    ""   # "*" = any SVM                  |  "vs0"   = restrict to vs0

  # ----------------------------------------------------------------
  # CREDENTIALS (same on both clusters)
  # ----------------------------------------------------------------
  DEST_USER: ""   # cluster admin username
  DEST_PASS: ""   # cluster admin password

# ── Shared HTTP defaults ────────────────────────────────────────────
# All http steps use the same cluster credentials; merged here once.
defaults:
  http:
    headers:
      Accept: "application/hal+json"
      X-Dot-Client-App: "orchestrio"
    username: "{{ env.DEST_USER }}"
    password: "{{ env.DEST_PASS }}"
    verify_ssl: true
    timeout: 30

steps:

  # ================================================================
  # PHASE 0 - AUTO-DETECT WHICH CLUSTER HAS THE NEWEST DEST VOLUME
  # ================================================================

  # Step 0a - Query CLUSTER_A for target DP volume
  #           SOURCE_VOLUME=* finds newest DP volume; SOURCE_VOLUME=vol_9 finds vol_9_dest exactly
  - name: get_dp_vol_cluster_a
    type: http
    on_failure: continue
    config:
      method: GET
      url: "https://{{ env.CLUSTER_A }}/api/storage/volumes?type=dp&name={{ env.SOURCE_VOLUME }}_dest&order_by=create_time%20desc&max_records=1&fields=name,create_time&return_timeout=60"
      timeout: 20

  # Step 0b - Query CLUSTER_B for target DP volume
  - name: get_dp_vol_cluster_b
    type: http
    on_failure: continue
    config:
      method: GET
      url: "https://{{ env.CLUSTER_B }}/api/storage/volumes?type=dp&name={{ env.SOURCE_VOLUME }}_dest&order_by=create_time%20desc&max_records=1&fields=name,create_time&return_timeout=60"
      timeout: 20

  # Step 0c - Compare timestamps; print the winning cluster IP to stdout.
  #           Uses -notlike '{{*}}' to detect unresolved templates (no DP volume on that cluster).
  #           All downstream steps use {{ steps.pick_dest_cluster.stdout }} as the cluster IP.
  - name: pick_dest_cluster
    type: shell
    on_failure: stop
    config:
      timeout: 10
      command: |
        if [ "{{ steps.get_dp_vol_cluster_b.body.num_records }}" = "1" ]; then
          echo "{{ env.CLUSTER_B }}"
        elif [ "{{ steps.get_dp_vol_cluster_a.body.num_records }}" = "1" ]; then
          echo "{{ env.CLUSTER_A }}"
        else
          echo "ERROR: No DP volumes found on either cluster"
          exit 1
        fi

  # Step 0b - Find the target DP volume on the winning cluster
  #           Note: svm.name is NOT filtered here — the winner cluster may use a different
  #           SVM name than SOURCE_SVM (which is the source-side SVM). name filter is enough.
  - name: discover_latest_dest_volume
    type: http
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/storage/volumes?type=dp&name={{ env.SOURCE_VOLUME }}_dest&order_by=create_time%20desc&max_records=1&fields=name,uuid,svm.name,state,space.size&return_timeout=120"
    retry:
      attempts: 3
      delay_seconds: 5

  # Step 0c - Print what was auto-discovered
  - name: print_discovered_target
    type: shell
    config:
      command: |
        echo "=== AUTO-DISCOVERY RESULT ==="
        echo "  Selected cluster : {{ steps.pick_dest_cluster.stdout }}"
        echo "  Dest volume      : {{ steps.discover_latest_dest_volume.body.records.0.name }}"
        echo "  Dest SVM         : {{ steps.discover_latest_dest_volume.body.records.0.svm.name }}"
        echo "  Volume UUID      : {{ steps.discover_latest_dest_volume.body.records.0.uuid }}"
        echo "  Volume state     : {{ steps.discover_latest_dest_volume.body.records.0.state }}"
        echo "  Volume size      : {{ steps.discover_latest_dest_volume.body.records.0.space.size }}"

  # ================================================================
  # PHASE A - PRE-FLIGHT CHECKS
  # ================================================================

  # Step A1 - Verify destination cluster connectivity
  - name: verify_dest_cluster
    type: http
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/cluster?fields=name,version&return_timeout=120"
    retry:
      attempts: 3
      delay_seconds: 10

  - name: print_cluster_banner
    type: shell
    config:
      command: |
        echo "=== SnapMirror Test Failover ==="
        echo "DEST CLUSTER | name={{ steps.verify_dest_cluster.body.name }} | ontap={{ steps.verify_dest_cluster.body.version.full }}"

  # Step A2 - Retrieve existing SnapMirror relationship using auto-discovered svm:volume
  - name: get_sm_relationship
    type: http
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/snapmirror/relationships?destination.path={{ steps.discover_latest_dest_volume.body.records.0.svm.name }}:{{ steps.discover_latest_dest_volume.body.records.0.name }}&fields=uuid,source.path,destination.path,state,lag_time,healthy,policy.name&max_records=1&return_timeout=120"

  - name: print_relationship_health
    type: shell
    config:
      command: |
        echo "RELATIONSHIP"
        echo "  UUID    : {{ steps.get_sm_relationship.body.records.0.uuid }}"
        echo "  Source  : {{ steps.get_sm_relationship.body.records.0.source.path }}"
        echo "  Dest    : {{ steps.get_sm_relationship.body.records.0.destination.path }}"
        echo "  State   : {{ steps.get_sm_relationship.body.records.0.state }}"
        echo "  Healthy : {{ steps.get_sm_relationship.body.records.0.healthy }}"
        echo "  Lag     : {{ steps.get_sm_relationship.body.records.0.lag_time }}"
        echo "  Policy  : {{ steps.get_sm_relationship.body.records.0.policy.name }}"

  # ================================================================
  # PHASE B - GET LATEST SNAPMIRROR SNAPSHOT
  # ================================================================

  # Step B1 - Get the latest SnapMirror snapshot using the auto-discovered volume UUID
  - name: get_latest_snapshot
    type: http
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/storage/volumes/{{ steps.discover_latest_dest_volume.body.records.0.uuid }}/snapshots?max_records=1&fields=name,create_time&order_by=create_time%20desc&return_timeout=120"

  - name: print_snapshot
    type: shell
    config:
      command: |
        echo "LATEST SM SNAPSHOT | name={{ steps.get_latest_snapshot.body.records.0.name }} | created={{ steps.get_latest_snapshot.body.records.0.create_time }}"

  # Guard - stop with clear message if no SnapMirror snapshot exists yet
  - name: check_snapshot_exists
    type: shell
    on_failure: stop
    config:
      command: |
        if [ "{{ steps.get_latest_snapshot.body.num_records }}" = "0" ]; then
          echo "ERROR: No SnapMirror snapshots on {{ steps.discover_latest_dest_volume.body.records.0.name }}, run provision workflow first"
          exit 1
        else
          echo "SNAPSHOT OK - using {{ steps.get_latest_snapshot.body.records.0.name }}"
        fi

  # ================================================================
  # PHASE C - TEST FAILOVER (FlexClone)
  # ================================================================

  # Step C1 - Create writable FlexClone from the latest SM snapshot
  - name: create_test_clone
    type: http
    on_failure: continue
    config:
      method: POST
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/storage/volumes?return_timeout=120"
      headers:
        Content-Type: "application/json"
      timeout: 60
      body:
        name: "{{ steps.discover_latest_dest_volume.body.records.0.name }}_clone"
        svm:
          name: "{{ steps.discover_latest_dest_volume.body.records.0.svm.name }}"
        nas:
          path: "/{{ steps.discover_latest_dest_volume.body.records.0.name }}_clone"
        clone:
          is_flexclone: true
          parent_volume:
            name: "{{ steps.discover_latest_dest_volume.body.records.0.name }}"
          parent_snapshot:
            name: "{{ steps.get_latest_snapshot.body.records.0.name }}"

  # Step C2 - Poll clone job
  - name: poll_clone_job
    type: http
    on_failure: continue
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/cluster/jobs/{{ steps.create_test_clone.body.job.uuid }}?fields=state,message,error,code&return_timeout=120"
      timeout: 300
      poll:
        interval_seconds: 5
        until:
          field: state
          not_equals: running
    retry:
      attempts: 2
      delay_seconds: 5

  - name: print_clone_job_result
    type: shell
    on_failure: continue
    config:
      command: |
        echo "CLONE JOB | state={{ steps.poll_clone_job.body.state }} | message={{ steps.poll_clone_job.body.message }}"

  # ================================================================
  # PHASE D - VERIFY ACCESS
  # ================================================================

  # Step D1 - Confirm clone volume is online and mounted
  - name: get_clone_volume
    type: http
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/storage/volumes?max_records=1&name={{ steps.discover_latest_dest_volume.body.records.0.name }}_clone&svm.name={{ steps.discover_latest_dest_volume.body.records.0.svm.name }}&fields=name,uuid,state,nas.path,space.size&return_timeout=120"

  - name: print_failover_ready
    type: shell
    config:
      command: |
        echo "=== TEST FAILOVER READY ==="
        echo "  Clone    : {{ steps.get_clone_volume.body.records.0.name }}"
        echo "  UUID     : {{ steps.get_clone_volume.body.records.0.uuid }}"
        echo "  State    : {{ steps.get_clone_volume.body.records.0.state }}"
        echo "  Junction : {{ steps.get_clone_volume.body.records.0.nas.path }}"
        echo "  SVM      : {{ steps.discover_latest_dest_volume.body.records.0.svm.name }}"
        echo "  Snapshot : {{ steps.get_latest_snapshot.body.records.0.name }}"
        echo ""
        echo "  ACTION: Mount {{ steps.get_clone_volume.body.records.0.nas.path }} from SVM {{ steps.discover_latest_dest_volume.body.records.0.svm.name }} on a test client."

  # Step D2 - Tag clone with SM relationship UUID so cleanup can safely identify it.
  #           Tag format: "<sm_relationship_uuid>:test"
  #           cleanup-test-failover.yaml uses this tag to find ONLY workflow-created
  #           clones - manually created volumes are never touched.
  - name: tag_clone_volume
    type: http
    on_failure: continue
    config:
      method: PATCH
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/storage/volumes/{{ steps.get_clone_volume.body.records.0.uuid }}?return_timeout=120"
      headers:
        Content-Type: "application/json"
      body:
        _tags:
          - "{{ steps.get_sm_relationship.body.records.0.uuid }}:test"

  - name: print_tag_applied
    type: shell
    on_failure: continue
    config:
      command: |
        echo "TAG APPLIED | clone={{ steps.get_clone_volume.body.records.0.name }} | tag={{ steps.get_sm_relationship.body.records.0.uuid }}:test"

  # ================================================================
  # PHASE E - RESYNC & VALIDATE
  # ================================================================

  # Step E1 - Resync SnapMirror relationship (PATCH state to snapmirrored)
  - name: resync_sm_relationship
    type: http
    on_failure: continue
    config:
      method: PATCH
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/snapmirror/relationships/{{ steps.get_sm_relationship.body.records.0.uuid }}?return_timeout=120"
      headers:
        Content-Type: "application/json"
      timeout: 60
      body:
        state: "snapmirrored"

  - name: poll_resync_job
    type: http
    on_failure: continue
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/cluster/jobs/{{ steps.resync_sm_relationship.body.job.uuid }}?fields=state,message,error,code&return_timeout=120"
      timeout: 600
      poll:
        interval_seconds: 10
        until:
          field: state
          not_equals: running

  # Step E2 - Wait for relationship to return to snapmirrored
  - name: wait_for_snapmirrored
    type: http
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/snapmirror/relationships/{{ steps.get_sm_relationship.body.records.0.uuid }}?fields=state,lag_time,healthy&return_timeout=120"
      timeout: 1800
      poll:
        interval_seconds: 15
        until:
          field: state
          equals: snapmirrored
    retry:
      attempts: 3
      delay_seconds: 15

  # Step E3 - Final authoritative health validation
  - name: validate_final_health
    type: http
    config:
      method: GET
      url: "https://{{ steps.pick_dest_cluster.stdout }}/api/snapmirror/relationships/{{ steps.get_sm_relationship.body.records.0.uuid }}?fields=uuid,source.path,destination.path,state,lag_time,healthy,policy.name&return_timeout=120"

  - name: print_final_report
    type: shell
    config:
      command: |
        echo "=== DR TEST COMPLETE ==="
        echo "  Source      : {{ steps.validate_final_health.body.source.path }}"
        echo "  Destination : {{ steps.validate_final_health.body.destination.path }}"
        echo "  State       : {{ steps.validate_final_health.body.state }}"
        echo "  Healthy     : {{ steps.validate_final_health.body.healthy }}"
        echo "  Lag Time    : {{ steps.validate_final_health.body.lag_time }}"
        echo "  Policy      : {{ steps.validate_final_health.body.policy.name }}"
