name: defaults-demo
version: "1"
description: >
  Demonstrates the "defaults" block — shared config that is automatically
  merged into every step of a given type.  Step-level config always wins.

  Without defaults, every HTTP step would repeat the same headers, auth,
  timeout, and verify_ssl block.  With defaults you declare it once.

env:
  API_HOST: "jsonplaceholder.typicode.com"
  API_TOKEN: "demo-token"

# ── Shared HTTP config ──────────────────────────────────────────
# These values are deep-merged into every step with type: http.
# If a step specifies the same key, the step's value wins.
# Nested dicts (like headers) are merged — not replaced.
defaults:
  http:
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{ env.API_TOKEN }}"
    timeout: 15
    verify_ssl: true

steps:

  # Only url + method needed — headers, auth, timeout, verify_ssl come from defaults
  - name: get_user
    type: http
    config:
      method: GET
      url: "https://{{ env.API_HOST }}/users/1"

  # Step-level timeout (5) overrides the default (15).
  # Step-level Content-Type header is *merged* with default headers —
  # the final headers will be Accept + Authorization + Content-Type.
  - name: create_post
    type: http
    config:
      method: POST
      url: "https://{{ env.API_HOST }}/posts"
      headers:
        Content-Type: "application/json"
      timeout: 5
      body:
        title: "Post by {{ steps.get_user.body.name }}"
        body: "Automated post"
        userId: "{{ steps.get_user.body.id }}"

  # Shell steps are unaffected — http defaults don't leak into other types
  - name: summarize
    type: shell
    config:
      command: "echo 'Created post for user: {{ steps.get_user.body.name }}'"
