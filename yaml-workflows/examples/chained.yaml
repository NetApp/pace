name: chained-api-calls
version: "1"
description: >
  Demonstrates step chaining — output from one step is used
  as input to the next via {{ steps.<name>.<path> }} templates.

steps:
  - name: get_user
    type: http
    config:
      method: GET
      url: https://jsonplaceholder.typicode.com/users/1

  - name: get_user_posts
    type: http
    config:
      method: GET
      url: "https://jsonplaceholder.typicode.com/posts?userId={{ steps.get_user.body.id }}"
    retry:
      attempts: 3
      delay_seconds: 2

  - name: summarize
    type: shell
    config:
      command: "echo 'Fetched posts for user: {{ steps.get_user.body.name }}'"
