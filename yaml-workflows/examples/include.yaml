name: include-demo
version: "1"
description: >
  Demonstrates the "include" directive — reference reusable step fragments
  from external YAML files instead of defining every step inline.

  Steps can be included as-is, or customized via the "override" block.
  "override.config" is deep-merged (your values win); other fields replace.

env:
  ONTAP_HOST: "172.29.218.204"
  ONTAP_USER: "admin"
  ONTAP_PASS: "netapp1!"

# Shared auth so each step doesn't repeat it
defaults:
  http:
    headers:
      Accept: "application/hal+json"
      X-Dot-Client-App: "orchestrio"
    username: "{{ env.ONTAP_USER }}"
    password: "{{ env.ONTAP_PASS }}"
    timeout: 30
    verify_ssl: false

steps:

  # Include a fragment as-is — inherits name, type, config, retry from the file
  - include: ../steps/ontap-discover-nodes.yaml

  # Include with overrides — rename the step and set the job URL
  - include: ../steps/ontap-poll-job.yaml
    override:
      name: track_cluster_job
      config:
        url: "https://{{ env.ONTAP_HOST }}/api/cluster/jobs/some-uuid"

  # Regular inline steps work alongside includes
  - name: summarize
    type: shell
    config:
      command: "echo 'Done — discovered nodes and polled job.'"
