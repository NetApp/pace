# Reusable step: list all nodes with serial numbers.
# Expects env: ONTAP_HOST
# Best used with defaults for auth (username/password/headers/verify_ssl).
name: get_nodes
type: http
config:
  method: GET
  url: "https://{{ env.ONTAP_HOST }}/api/cluster/nodes?fields=name,serial_number&return_timeout=120"
